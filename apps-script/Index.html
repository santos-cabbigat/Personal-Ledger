<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared ledger</title><style>
:root{color-scheme:dark;--bg:#0c1022;--panel:#141c34;--text:#eff4ff;--muted:#b2c2da;--line:#344462;--cyan:#70e8fa;--rose:#f399e5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 91% 0%,#233d68 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.42 system-ui,sans-serif;min-height:100vh}main{max-width:680px;margin:auto;padding:22px 16px 48px}header,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:9px}header{padding-bottom:16px;border-bottom:1px solid var(--cyan)}h1{font-size:clamp(20px,5vw,29px);margin:0;overflow-wrap:anywhere}h2{font-size:19px;margin:16px 0 10px}h3{font-size:16px}button,.link,select,input{border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;padding:9px 12px;min-height:44px}button,.link{cursor:pointer;text-decoration:none}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan)}.gear{font-size:19px;padding:6px 10px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}.tiles button{text-align:left;font-weight:650;min-height:47px;border:1px solid transparent;background:linear-gradient(110deg,#251b37,#101f3a) padding-box,linear-gradient(110deg,#dc81d6,#68d5f6) border-box}.tiles i{font-style:normal;color:var(--cyan);display:inline-block;width:25px}.panel{background:#141b30;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.kpi{font-size:25px;font-variant-numeric:tabular-nums;font-weight:650}.sub,.muted,small{color:var(--muted);font-size:13px}.money{white-space:nowrap;font-variant-numeric:tabular-nums}.item{padding:10px 0;border-bottom:1px solid #33405a;display:block;width:100%;text-align:left;background:none;border-radius:0;border-left:0;border-right:0;border-top:0}.item:last-child{border-bottom:0}.item strong{overflow-wrap:anywhere}dialog{width:min(95vw,560px);max-height:90dvh;overflow:auto;border:1px solid #84dff1;background:#10182d;color:var(--text);border-radius:18px;padding:18px;box-shadow:0 12px 80px #050912}dialog::backdrop{background:#030610bd}dialog h2{margin:0}.body{margin:13px 0}.line{border-top:1px solid var(--line);padding:10px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0}label select,label input{margin-top:3px;width:100%;color:var(--text);font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{justify-content:flex-end;flex-wrap:wrap;margin-top:14px}.primary{background:#a9edff;color:#071824;font-weight:650}.notice{color:#ffc7a2;white-space:pre-wrap;overflow-wrap:anywhere}.status{min-height:18px;font-size:13px;color:var(--muted)}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}.link{display:inline-flex;align-items:center}.wrap{flex-wrap:wrap}dialog button[aria-label=Close]{min-width:44px} [hidden]{display:none!important}

body{background:radial-gradient(ellipse at 90% 0%,#1c2148 0%,transparent 45%),#0a1021}
main{padding-top:12px}header.hero{min-height:91px;position:relative;isolation:isolate;overflow:hidden;padding:13px 7px 16px 0;border:0;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,#ef74cd,#826af9,#68e1f3) 1}
.hero h1{max-width:68%;letter-spacing:-.037em;line-height:1.12;text-wrap:balance;font-size:clamp(21px,5vw,31px)}
.orb{position:absolute;right:32px;top:-20px;width:124px;height:124px;border-radius:50%;opacity:.65;z-index:-1;background:radial-gradient(circle,#80dcff 1px,transparent 1.6px) 0 0/5px 5px,radial-gradient(at 35% 30%,#7b3385,#234c80 50%,transparent 72%);mask-image:radial-gradient(circle at 56% 42%,#000 18%,#0008 48%,transparent 72%);transform:rotate(-20deg)}
.hero .gear{background:#111b32c9}.tiles{margin:14px 0 16px}.tiles button{display:flex;align-items:center;gap:8px;font-size:15px}.tiles i{display:grid;place-items:center;width:22px}.tiles svg{width:19px;height:19px;fill:none;stroke:#b4e9ff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.panel{background:linear-gradient(110deg,#1c203c,#131e36);border-top-color:#927acc}.kpi{font-size:30px}.status{margin-top:8px;color:#c3b6f2}.item{border-color:#273552}button{touch-action:manipulation}button:active{filter:brightness(1.22)}h2{letter-spacing:-.02em}
</style></head><body><main><header class="hero"><div class="orb" aria-hidden="true"></div><h1 id="title">Shared ledger</h1><button class="gear" aria-label="Settings" onclick="settings()">⚙</button></header><nav class="tiles"><button onclick="journals()"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2zM8 4v16m3-11h5m-5 4h4"/></svg></i>Journal</button><button onclick="accountsView()"><i aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="8" y="2.5" width="8" height="5" rx="1"/><path d="M12 8v4M5 15v-3h14v3"/><rect x="2" y="15" width="6" height="5" rx="1"/><rect x="16" y="15" width="6" height="5" rx="1"/></svg></i>Accounts</button><button onclick="entryForm('Expense')"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3l2 1.5L9 3l3 1.5L15 3l2 1.5L19 3v18l-3-2-4 2-4-2-3 2zM8 9h8m-8 4h6"/></svg></i>Expense</button><button onclick="reports()"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 17v-4h3v4m3 0V8h3v9m3 0V4h3v13"/></svg></i>Reports</button></nav><div class="row"><select id="scope" aria-label="Home book" onchange="home()"><option>All books</option><option>Personal</option><option>Business</option></select><button onclick="load()">Refresh</button></div><div class="status" id="status" role="status"></div><div id="homeData"></div></main><dialog id="modal"><header><h2 id="heading"></h2><button aria-label="Close" onclick="closeDialog()">×</button></header><section id="content" class="body"></section><div class="notice" id="err" role="alert"></div></dialog>
<script>
'use strict';
const el=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=n=>'₭'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const inSheet = Boolean(window.google && google.script && google.script.run);
const call = inSheet
  ? (method,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args))
  : previewCall;
let data=null,draft=null,locked=false;
function ready(){if(data)return true;el('status').textContent='Load the ledger before opening a section.';return false}
async function load(){el('status').textContent=inSheet?'Reading Google Sheet…':'Loading sample entries…';try{data=await call('state');el('title').textContent=data.title;document.title=data.title;el('status').textContent=inSheet?'Saved books · Google Sheets':'Preview · Sample data only';home()}catch(e){el('status').textContent='Could not read the ledger. '+e.message}}
function dialog(title,html){el('heading').textContent=title;el('content').innerHTML=html;el('err').textContent='';if(!el('modal').open)el('modal').showModal();el('modal').scrollTop=0}
function closeDialog(){if(!locked)el('modal').close()}
el('modal').addEventListener('cancel',event=>{if(locked)event.preventDefault()});
function guard(f){try{f()}catch(e){el('err').textContent=e.message}}
function options(values,current){return values.map(v=>'<option '+(v===current?'selected':'')+'>'+esc(v)+'</option>').join('')}
function field(name,html){return '<label>'+name+html+'</label>'}
function btn(label,fn,primary=false){return '<button class="'+(primary?'primary':'')+'" onclick="'+fn+'">'+label+'</button>'}
function groupEntries(rows){const groups=new Map();rows.forEach(r=>{if(!groups.has(r.id))groups.set(r.id,[]);groups.get(r.id).push(r)});return [...groups.values()].reverse()}
function filtered(){const book=el('scope').value;return data.entries.filter(r=>book==='All books'||r.book===book)}
function entryList(groups){return groups.map(g=>{const r=g[0],index=data.entries.indexOf(r);return '<button class="item" onclick="detail('+index+')"><span class="row"><strong>'+esc(r.memo)+'</strong><b class="money">'+amount(g.reduce((a,l)=>a+l.debit,0))+'</b></span><small>'+esc(r.date)+' · '+esc(r.book)+'</small></button>'}).join('')||'<p class="muted">No entries yet.</p>'}
function net(rows,type){return rows.filter(r=>r.type===type).reduce((s,r)=>s+Math.round(r.debit*100)-Math.round(r.credit*100),0)/100}
function home(){if(!data)return;let rows=filtered();el('homeData').innerHTML='<section class="panel"><small>Net income · All dates</small><div class="kpi">'+amount(-net(rows,'Income')-net(rows,'Expense'))+'</div></section><h2>Recent entries</h2>'+entryList(groupEntries(rows).slice(0,5))}
function detail(index){const row=data.entries[index],lines=data.entries.filter(r=>r.id===row.id);dialog('Journal entry','<b>'+esc(row.memo)+'</b><p class="sub">'+esc(row.book)+' · '+esc(row.date)+'</p>'+ledgerTable(lines)+'<p class="sub">Posted by '+esc(row.by)+'</p>')}
function ledgerTable(lines){return '<div class="table"><table><tr><th>Account</th><th>Debit</th><th>Credit</th></tr>'+lines.map(l=>'<tr><td>'+esc(l.name)+'</td><td>'+(+l.debit?amount(l.debit):'—')+'</td><td>'+(+l.credit?amount(l.credit):'—')+'</td></tr>').join('')+'</table></div>'}
function journals(){if(!ready())return;dialog('Journal','<div class="actions">'+btn('New entry',"entryForm(\'Journal\')",true)+'</div>'+entryList(groupEntries(filtered())))}
function accountsView(){if(!ready())return;dialog('Chart of accounts',btn('Add account','newAccount()',true)+data.accounts.map((a,i)=>'<button class="item" onclick="accountDetail('+i+')"><strong>'+esc(a.code)+' · '+esc(a.name)+'</strong><br><small>'+esc(a.type)+' · '+esc(a.use)+(a.parent?' · Parent '+esc(a.parent):'')+'</small></button>').join(''))}
function accountDetail(i){let a=data.accounts[i];let codes=new Set([a.code]);for(let j=0;j<data.accounts.length;j++){let n=codes.size;data.accounts.forEach(v=>{if(codes.has(v.parent))codes.add(v.code)});if(n===codes.size)break}dialog(a.name,entryList(groupEntries(filtered().filter(r=>codes.has(r.code)))))}
function acOptions(list,current){return list.map(a=>'<option value="'+esc(a.code)+'" '+(a.code===current?'selected':'')+'>'+esc(a.code)+' · '+esc(a.name)+'</option>').join('')}
function newAccount(){dialog('Add account',field('Code','<input id="code" inputmode="numeric">')+field('Name','<input id="accountName" maxlength="80">')+field('Classification','<select id="classify" onchange="parents()">'+options(['Asset','Liability','Equity','Income','Expense'])+'</select>')+field('Parent account','<select id="parent"></select>')+field('Use','<select id="use">'+options(['Posting','Group'])+'</select>')+btn('Save account','addAccount()',true));parents()}
function parents(){el('parent').innerHTML='<option value="">No parent</option>'+acOptions(data.accounts.filter(a=>a.use==='Group'&&a.type===el('classify').value))}
async function write(method,args,after){if(locked)return;locked=true;el('err').textContent='Saving…';try{await call(method,...args)}catch(e){el('err').textContent=e.message;locked=false;return}locked=false;el('modal').close();await load();if(after)after()}
function addAccount(){write('saveAccount',[{code:el('code').value,name:el('accountName').value,type:el('classify').value,parent:el('parent').value,use:el('use').value}],accountsView)}
function entryForm(mode,keep=false){if(!ready())return;if(!keep){draft={mode,key:crypto.randomUUID(),book:el('scope').value==='Business'?'Business':'Personal',date:data.today,memo:'',lines:[{code:mode==='Expense'?'5100':'1100',debit:'',credit:''},{code:mode==='Expense'?'1100':'4100',debit:'',credit:''}]}}dialog(mode==='Expense'?'Record expense':'New journal entry','<div class="two">'+field('Book','<select id="book">'+options(['Personal','Business'],draft.book)+'</select>')+field('Date','<input type="date" id="date" value="'+esc(draft.date)+'">')+'</div>'+field('Description','<input id="memo" maxlength="180" value="'+esc(draft.memo)+'">')+'<div id="lines"></div><div class="actions">'+(mode==='Journal'?btn('Add line','addLine()'):'')+btn('Review','guard(review)',true)+'</div>');drawLines()}
function drawLines(){const list=data.accounts.filter(a=>a.use==='Posting');if(draft.mode==='Expense'){el('lines').innerHTML=field('Expense account','<select id="ac0">'+acOptions(list.filter(a=>a.type==='Expense'),draft.lines[0].code)+'</select>')+field('Paid from','<select id="ac1">'+acOptions(list.filter(a=>a.type==='Asset'||a.type==='Liability'),draft.lines[1].code)+'</select>')+field('Amount (LAK)','<input inputmode="decimal" id="expAmount" value="'+esc(draft.lines[0].debit)+'">');return}
el('lines').innerHTML=draft.lines.map((l,i)=>'<div class="line">'+field('Account','<select id="ac'+i+'">'+acOptions(list,l.code)+'</select>')+'<div class="two">'+field('Debit','<input inputmode="decimal" id="dr'+i+'" value="'+esc(l.debit)+'">')+field('Credit','<input inputmode="decimal" id="cr'+i+'" value="'+esc(l.credit)+'">')+'</div>'+(draft.lines.length>2?btn('Remove','removeLine('+i+')'):'')+'</div>').join('')}
function readForm(){draft.book=el('book').value;draft.date=el('date').value;draft.memo=el('memo').value.trim();draft.lines.forEach((l,i)=>{l.code=el('ac'+i).value;if(draft.mode==='Expense'){l.debit=i===0?el('expAmount').value:'';l.credit=i===1?el('expAmount').value:''}else{l.debit=el('dr'+i).value.trim();l.credit=el('cr'+i).value.trim()}})}
function addLine(){readForm();if(draft.lines.length<40){draft.lines.push({code:'',debit:'',credit:''});drawLines()}}
function removeLine(i){readForm();draft.lines.splice(i,1);drawLines()}
function review(){readForm();if(!draft.memo||!draft.date)throw Error('Enter a date and description.');
let dr=0,cr=0;for(const l of draft.lines){for(const n of [l.debit,l.credit])if(n&&!/^(0|[1-9]\d{0,10})(\.\d{1,2})?$/.test(n))throw Error('Enter amounts with up to two decimals.');if((+l.debit>0)===(+l.credit>0))throw Error('Each account needs either a debit or a credit.');dr+=Math.round(l.debit*100);cr+=Math.round(l.credit*100)}
if(dr!==cr||!dr||new Set(draft.lines.map(l=>l.code)).size<2)throw Error('Debits and credits must balance across at least two accounts.');
const lines=draft.lines.map(l=>({...l,name:data.accounts.find(a=>a.code===l.code).name}));dialog('Review entry','<strong>'+esc(draft.memo)+'</strong><p class="sub">'+esc(draft.book)+' · '+esc(draft.date)+'</p>'+ledgerTable(lines)+'<p>Balanced · '+amount(dr/100)+'</p><div class="actions">'+btn('Back','entryForm(draft.mode,true)')+btn('Post entry','post()',true)+'</div>')}
function post(){write('postEntry',[draft],()=>{draft=null})}
function reports(){if(!ready())return;dialog('Reports',field('Report','<select id="report" onchange="reportData()">'+options(['Trial balance','Income and expenses','Balance sheet','General ledger'])+'</select>')+'<div class="two">'+field('From','<input type="date" id="from" onchange="reportData()">')+field('Through','<input type="date" id="through" onchange="reportData()">')+'</div><div id="result"></div>');reportData()}
function reportData(){const kind=el('report').value,from=el('from').value,to=el('through').value,asOf=kind==='Balance sheet';el('from').disabled=asOf;if(!asOf&&from&&to&&from>to){el('result').textContent='Choose an end date on or after the start date.';return}const rows=filtered().filter(r=>(asOf||!from||r.date>=from)&&(!to||r.date<=to));const accounts=data.accounts.filter(a=>a.use==='Posting');let html='<small>'+esc(el('scope').value)+'</small>';if(kind==='Income and expenses'){const inc=-net(rows,'Income'),exp=net(rows,'Expense');html+=[['Income',inc],['Expenses',exp],['Net income',inc-exp]].map(([label,n])=>'<p class="row"><span>'+label+'</span><b>'+amount(n)+'</b></p>').join('')}else if(asOf){const earn=-net(rows,'Income')-net(rows,'Expense');html+=[['Assets',net(rows,'Asset')],['Liabilities',-net(rows,'Liability')],['Equity before earnings',-net(rows,'Equity')],['Accumulated earnings',earn],['Total liabilities and equity',-net(rows,'Liability')-net(rows,'Equity')+earn]].map(([label,n])=>'<p class="row"><span>'+label+'</span><b>'+amount(n)+'</b></p>').join('')}else if(kind==='General ledger'){html+=accounts.map(a=>{const lines=rows.filter(r=>r.code===a.code);return lines.length?'<h3>'+esc(a.code)+' · '+esc(a.name)+'</h3>'+ledgerTable(lines.map(l=>({...l,name:l.date+' · '+l.memo}))):''}).join('')||'<p>No entries in this period.</p>'}else{let dr=0,cr=0;const lines=accounts.map(a=>{let netCents=rows.filter(r=>r.code===a.code).reduce((n,r)=>n+Math.round(r.debit*100)-Math.round(r.credit*100),0);let debit=Math.max(netCents,0)/100,credit=Math.max(-netCents,0)/100;dr+=debit;cr+=credit;return {name:a.name,debit,credit}}).filter(r=>r.debit||r.credit);html+=ledgerTable([...lines,{name:'Total',debit:dr,credit:cr}])}el('result').innerHTML=html}
function sheetSettings(){if(!ready())return;dialog('Settings',(data.owner?field('App name','<input id="appName" value="'+esc(data.title)+'" maxlength="60">')+btn('Save name','saveName()'):'<b>'+esc(data.title)+'</b>')+'<p class="sub">Signed in as '+esc(data.email)+'</p><a class="link" href="'+esc(data.url)+'" target="_blank" rel="noopener">Open Google Sheet</a>'+(data.owner?'<p>To add another person, open the Sheet, tap Share, and invite their Google account as an editor.</p>':''))}
function settings(){if(!ready())return;if(inSheet)return sheetSettings();dialog('Settings',field('App name','<input id="appName" value="'+esc(data.title)+'" maxlength="60">')+btn('Save name','saveName()',true)+'<p class="sub">Preview changes last until you reload this page.</p>')}
function saveName(){write('renameLedger',[el('appName').value])}
load();
</script></body></html>
