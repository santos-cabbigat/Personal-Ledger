<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f1ecdf"><title>Personal &amp; Business Ledger</title>
<style>:root {
  color-scheme: light;
  --paper: #f1ecdf;
  --face: #f6f1e6;
  --well: #e9e1d1;
  --ink: #282d28;
  --muted: #64655b;
  --teal: #075c58;
  --line: #d7cfbe;
  --raised: -3px -3px 7px #fffaf0, 3px 4px 8px #6e593d29;
  --inset: inset 2px 2px 4px #7967472b, inset -2px -2px 4px #fffaf1;
  font: 16px/1.5 Inter, "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); }
main { width: min(100%, 1176px); margin: auto; padding: 0 clamp(16px,4vw,56px) 48px; }
header,.row,.actions,.sectionHead,.brand,.filters,.brandMark,.navRail,.navRail button,.entryIcon { display: flex; align-items: center; }
header,.row,.sectionHead { justify-content: space-between; gap: 12px; }
.hero { padding: clamp(20px,4vw,43px) 0 22px; }
.brand { gap: 12px; min-width: 0; }
.brandMark,.entryIcon { justify-content: center; flex-shrink: 0; }
.brandMark { width: 45px; height: 45px; border-radius: 14px; color: var(--teal); background: var(--face); box-shadow: var(--raised); border: 1px solid #fff9e9; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brandMark svg { width: 24px; height: 24px; }
h1,h2,h3,h4,p { margin-top: 0; }
h1 { font-size: clamp(19px,2.4vw,29px); line-height: 1.16; letter-spacing: -.047em; margin: 0; overflow-wrap: anywhere; }
h2 { font-size: clamp(21px,2.6vw,32px); letter-spacing: -.045em; line-height: 1.2; margin: 0; }
h3 { font-size: 17px; letter-spacing: -.025em; }
button,.link,select,input { font: inherit; color: var(--ink); }
button,.link { border: 1px solid #dfd8c9; background: var(--face); border-radius: 12px; padding: 9px 15px; min-height: 42px; cursor: pointer; box-shadow: var(--raised); font-size: 14px; font-weight: 620; touch-action: manipulation; }
.link { display: inline-flex; align-items: center; text-decoration: none; }
button:enabled:hover,.link:hover { background: #faf6eb; border-color: #bdb5a3; }
button:enabled:active,.link:active { box-shadow: var(--inset); }
button:disabled,select:disabled,input:disabled { opacity: .57; cursor: default; box-shadow: none; }
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible { outline: 3px solid #36857b; outline-offset: 3px; }
.primary,button.primary:hover,.link.primary:hover { background: var(--teal); color: #fffdf4; border-color: #0a5a55; border-radius: 30px; padding-inline: 20px; }
button.gear { display: grid; place-items: center; width: 44px; padding: 0; color: var(--teal); border-radius: 14px; }
.navRail { gap: 6px; padding: 6px; background: #ebe5d8; box-shadow: var(--inset); border-radius: 16px; }
.navRail button { position: relative; justify-content: center; gap: 9px; flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 11px; background: transparent; box-shadow: none; color: #535950; padding-inline: 8px; }
.navRail button:hover { background: #f0eadf; }
.navRail button[aria-current=page] { border-color: #e8e0cf; background: var(--face); color: var(--teal); box-shadow: var(--raised); }
.navRail button[aria-current=page]::after { content: ""; position: absolute; width: 24px; height: 2px; bottom: 2px; background: var(--teal); border-radius: 4px; }
.navRail svg { width: 18px; height: 18px; }
.sectionHead { align-items: end; margin: 29px 0 17px; flex-wrap: wrap; }
.sectionHead h2 { margin-bottom: 2px; }
.status,.sub,.muted,small { color: var(--muted); font-size: 13px; }
.status { min-height: 1.5em; }
.filters,.actions,.wrap { flex-wrap: wrap; gap: 10px; }
.filters label { margin: 0; }
.filters select { min-height: 41px; width: auto; min-width: 128px; }
.filters button { margin-left: auto; }
.iconButton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0; }
label span.sub { display: block; }
input,select { background: #f1ecdf; box-shadow: var(--inset); border: 1px solid #c8bfae; border-radius: 10px; min-height: 44px; padding: 8px 11px; min-width: 0; max-width: 100%; }
label input,label select { display: block; margin-top: 5px; width: 100%; font-size: 16px; font-weight: 450; }
select { text-overflow: ellipsis; }
.panel,dialog,.workPanel,.entryPanel { border: 1px solid #e2dac9; background: var(--face); border-radius: 19px; box-shadow: var(--raised); }
.panel,.workPanel,.entryPanel { padding: clamp(16px,2.4vw,28px); margin: 18px 0; }
.overviewGrid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(0,1fr); gap: 16px; }
.overviewGrid .panel { margin: 0; }
.balance { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(20px,3.3vw,34px); border-left: 4px solid var(--teal); }
.balanceLabel,.summaryLine,.entry { display: flex; align-items: center; gap: 12px; }
.balanceLabel { color: var(--teal); font-weight: 680; }
.kpi { font-size: clamp(30px,5vw,59px); font-weight: 620; color: var(--teal); letter-spacing: -.062em; line-height: 1.16; margin: 14px 0 6px; overflow-wrap: anywhere; }
.money,.kpi,.metrics,.rline,table,.summaryLine strong { font-variant-numeric: tabular-nums; }
.summaryLine { justify-content: space-between; padding: 13px 0; }
.summaryLine+.summaryLine { border-top: 1px solid var(--line); }
.summaryLine span { color: var(--muted); }
.summaryLine strong { font-size: clamp(15px,2.2vw,22px); overflow-wrap: anywhere; }
.sectionHead.compact { align-items: center; margin: 0 0 10px; }
.sectionHead.compact h3 { margin: 0; font-size: 19px; }
.textButton { background: none; border-color: transparent; box-shadow: none; color: var(--teal); padding-inline: 7px; }
.entryPanel { padding-bottom: 8px; }
.item { display: block; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; box-shadow: none; width: 100%; padding: 13px 2px; text-align: left; }
.item:first-child { border-top: 0; }
.item:hover { border-color: var(--line); }
.entry { width: 100%; }
.entryIcon { height: 36px; width: 36px; background: #e9e9d9; color: var(--teal); border-radius: 11px; }
.entryText { flex: 1; min-width: 0; }
.entryText small { display: block; font-weight: 450; }
.item strong,.item small,.money { overflow-wrap: anywhere; }
.empty { text-align: center; margin: 18px 0; padding: 22px 14px; border: 1px dashed #bdb6a6; border-radius: 12px; color: var(--muted); }
.welcome { display:grid; grid-template-columns: minmax(0,1.2fr) minmax(190px,.85fr); align-items:center; gap:32px; padding: clamp(24px,5.5vw,72px); }
.welcome h3 { font-size: clamp(27px,4vw,43px); margin:0 0 12px; line-height:1.1; letter-spacing:-.055em; }
.welcome p { color:var(--muted); max-width:40ch; }
.welcome .actions { justify-content: flex-start; }
.bookWell { display:grid; place-items:center; min-height:200px; border-radius:24px; background:var(--well); box-shadow:var(--inset); overflow:hidden; }
.bookCover { width:121px; height:151px; position:relative; display:grid; place-items:center; border-radius:5px 13px 12px 6px; color:var(--teal); background:linear-gradient(90deg,#d3c8b3 0 8%,#e7decb 9% 11%,#f2e9d6 12%); border:1px solid #d7cbb2; box-shadow:2px 3px #f8efdd,3px 4px #c8bca2,5px 6px #f6eddb,8px 12px 12px #74634b39; transform:rotate(-8deg); }
.bookCover::before { content:""; position:absolute; right:17px; top:-1px; width:13px; height:41px; background:var(--teal); clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%); }
.bookCover svg { width:38px; height:38px; stroke-width:1.25; }
dialog { width: min(640px,calc(100vw - 28px)); max-height: min(90dvh,880px); padding: clamp(18px,3vw,28px); color: var(--ink); box-shadow: 0 16px 64px #40382045, inset 1px 1px 1px #fff9ec; }
dialog::backdrop { background: #38362955; }
dialog header { padding-bottom: 13px; border-bottom: 1px solid var(--line); }
dialog header button { min-width: 42px; padding: 3px 11px; font-size: 23px; }
.body { margin: 17px 0 0; }
.body > button,.workPanel > button { margin: 3px 8px 5px 0; }
.actions { display: flex; align-items: center; justify-content: flex-end; margin-top: 16px; }
.actions:first-child { margin-top: 0; margin-bottom: 14px; }
.two { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 4px 12px; }
.line { padding: 8px 14px 14px; margin: 14px 0; background: #eee8db; border: 1px solid var(--line); border-radius: 13px; }
summary { cursor: pointer; color: var(--teal); }
.notice { color: #873a29; overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 10px; }
.notice:empty { display: none; }
.table { max-width: 100%; overflow: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th,td { padding: 10px; text-align: right; border-bottom: 1px solid var(--line); }
th { background: #e9e3d5; color: #424d44; white-space: nowrap; }
td:first-child,th:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
.statement { font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fffcf4; }
.statementHead { padding: 20px; color: #fffaf0; background: #175b56; }
.statementHead small,.statementHead p { color: #f0e9da; }
.statementHead h2 { margin: 4px 0; }
.statementHead p { margin: 0; }
.statement section,.statement footer { padding: 16px 20px; }
.statement section+section,.statement footer { border-top: 1px solid var(--line); }
.statement h3,.statement h4 { color: var(--teal); margin: 0 0 10px; }
.statement h4 { margin-top: 12px; }
.closing { padding: 12px 15px; background: #e4ebe0; border-left: 3px solid var(--teal); margin-bottom: 12px; }
.closing span,.closing strong,.metrics small,.metrics b { display: block; }
.closing strong { font-size: 25px; }
.metrics { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
.metrics b { overflow-wrap: anywhere; }
.rline { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 5px 0; }
.expenseHeading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 15px; }
.expenseHeading h3,.expenseHeading label { margin: 0; }
.expenseAccount { border-top: 1px solid var(--line); }
.expenseAccount summary { display: flex; align-items: center; gap: 12px; padding: 12px 2px; min-height: 48px; }
.expenseAccount summary::-webkit-details-marker { display: none; }
.expenseAccount summary::before { content: ""; flex: none; width: 7px; height: 7px; border: solid var(--teal); border-width: 0 2px 2px 0; transform: rotate(-45deg); }
.expenseAccount[open] summary::before { transform: rotate(45deg); }
.expenseAccount .entry { min-width: 0; }
.expenseAccount .entryText { overflow-wrap: anywhere; }
.expenseAccount .item { padding-left: 20px; }
.statement footer { font-size: 12px; color: var(--muted); }
.statementImage { width: 100%; height: auto; display: block; }
.reportClean { padding: 8px; }
.reportClean .body { margin: 0; }
.reportClean>header { display: none; }
@media (max-width:640px) {
  main { padding-inline: 15px; }
  .hero { padding: 20px 0 16px; }
  .brand { gap: 9px; }
  .brandMark { width: 38px; height: 38px; border-radius: 11px; }
  .navRail { gap: 2px; padding: 4px; }
  .navRail button { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 1px; min-height: 49px; }
  .navRail button[aria-current=page]::after { bottom: 1px; }
  .sectionHead { margin: 21px 0 14px; }
  .overviewGrid { grid-template-columns: 1fr; gap: 12px; }
  .totals { display: grid; grid-template-columns: 1fr 1fr; padding: 14px 16px; }
  .summaryLine { display: grid; gap: 2px; padding: 0; }
  .summaryLine+.summaryLine { border: 0; border-left: 1px solid var(--line); padding-left: 16px; }
  .entryIcon { width: 30px; height: 33px; }
  .entry { gap: 8px; }
  .entry .money { max-width: 40%; }
  .entryText small { font-size: 11px; }
  .welcome { gap: 16px; grid-template-columns: 1fr; }
  .bookWell { min-height: 90px; grid-row: 1; }
  .bookCover { width: 58px; height: 72px; }
  .bookCover svg { width: 22px; height: 22px; }
  .bookCover::before { right: 8px; width: 7px; height: 18px; }
  .filters { gap: 6px; }
  .filters select { min-width: 0; max-width: 46vw; }
}
@media (max-width:390px) {
  h1 { font-size: 17px; }
  .two { gap: 6px; }
  .metrics { grid-template-columns: 1fr; }
  .entryIcon { display: none; }
}
@media print {
  body,main,.statement { background: white; }
  button,.navRail,.gear,.actions { display: none; }
  .panel,.workPanel,.entryPanel { box-shadow: none; }
}
</style>
</head><body>

  <header class="hero"><div class="brand"><div class="brandMark"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4.5c3.5-1 6.5-.6 9 1.4 2.5-2 5.5-2.4 9-1.4v15c-3.6-.9-6.5-.5-9 1.2-2.5-1.7-5.4-2.1-9-1.2zM12 6v14M6 8.4l3 .5M15 8.9l3-.5"/></svg></div><h1 id="title">Personal &amp; Business Ledger</h1></div><button class="gear" aria-label="Settings" onclick="settings()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m10 3 .5-1h3l.5 2 2 .9 1.9-.6 1.7 2.5-1.2 1.6.5 2.1 1.8 1v2.7l-2 .7-.9 2 1 1.7-2.4 2-1.7-.9-2 .5-.8 1.8h-3l-.6-2-2-.7-1.7.9-2-2.3.9-1.7-.6-2L2 13v-2.6l2-.8.8-2-1-1.7L6.2 4l1.8.9 2-.8z"/><circle cx="12" cy="12" r="3"/></svg></button></header>
  <nav class="navRail" aria-label="Ledger navigation"><button type="button" data-view="Overview" onclick="overview()" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Overview</span></button><button type="button" data-view="Journal" onclick="journals()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h13a1 1 0 0 1 1 1v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 1-2zM8 3v17m3-12h5m-5 4h4"/></svg><span>Journal</span></button><button type="button" data-view="Accounts" onclick="accountsView()"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="5" rx="1"/><path d="M12 8v4M5 16v-4h14v4"/><rect x="2" y="16" width="6" height="5" rx="1"/><rect x="16" y="16" width="6" height="5" rx="1"/></svg><span>Accounts</span></button><button type="button" data-view="Expense" onclick="expenses()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3l2 1.5L9 3l3 1.5L15 3l2 1.5L19 3v18l-3-2-4 2-4-2-3 2zM8 9h8m-8 4h6"/></svg><span>Expense</span></button><button type="button" data-view="Reports" onclick="reports()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 20h18M5 16v-4h3v4m3 0V8h3v8m3 0V4h3v12"/></svg><span>Reports</span></button></nav>
  <div class="sectionHead"><div><h2 id="viewTitle">Overview</h2><div class="status" id="status" role="status"></div></div>
  <div class="filters" id="tools" hidden><select id="scope" aria-label="Filter by book" onchange="changeScope()"><option value="">All books</option></select><button class="iconButton" onclick="load()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.1 8a7.5 7.5 0 0 1 12.5-2L20 9M4 15l2.4 3A7.5 7.5 0 0 0 19 16"/></svg> Refresh</button></div></div>
  <div id="homeData"></div><section class="workPanel" id="work" hidden></section>
  <footer class="sub"><p>Personal Ledger uses your Google Sheet to record transactions, show account balances, and prepare reports.</p>

</main>
<dialog id="modal" aria-labelledby="heading"><header><h2 id="heading"></h2><button aria-label="Close" onclick="closeDialog()">×</button></header><section id="content" class="body"></section><div class="notice" id="err" role="alert"></div></dialog>

<script>

'use strict';
const el=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=n=>'₭'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const inSheet = Boolean(window.google && google.script && google.script.run);
const preview = !inSheet && new URLSearchParams(location.search).get('preview')==='1';
const pages = !inSheet && !preview;
const call = inSheet
  ? (method,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args))
  : preview ? previewCall : ledgerGoogle.call;
let data=null,draft=null,locked=false;
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && data && !locked && !el('modal').open)load();
});
function ready(){if(data)return true;el('status').textContent='Connect Google Drive or open your ledger to continue.';return false}
let loadVersion=0, currentView='Overview';
function setView(name) {
  currentView=name;
  el('viewTitle').textContent=name;
  el('homeData').hidden=name!=='Overview';
  el('work').hidden=name==='Overview';
  for (const button of document.querySelectorAll('.navRail button')) {
    if(button.dataset.view===name) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  }
}
function overview(){setView('Overview'); if(data) home()}
function workspace(name,html) {
  if(el('modal').open) closeDialog();
  setView(name);
  el('work').innerHTML=html;
}
function changeScope() {
  if(el('modal').open)return;
  if(currentView==='Journal')journals();
  else if(currentView==='Expense')expenses();
  else if(currentView==='Accounts')accountsView();
  else if(currentView==='Reports')reports();
  else home();
}
function welcome(message='') {
  setView('Overview');
  el('tools').hidden=true;
  for(const button of document.querySelectorAll('.navRail button, .gear'))button.disabled=button.dataset.view!=='Overview';
  const installed='<a class="link '+(ledgerGoogle.configured()?'':'primary')+'" target="_blank" rel="noopener" href="'+ledgerGoogle.webApp+'">Open existing Google app</a>';
  const login=ledgerGoogle.configured()?btn('Sign in with Google','signIn()',true):'';
  const sample='<a class="link" href="?preview=1">Explore sample ledger</a>';
  el('homeData').innerHTML='<section class="panel welcome"><div><h3>Open your ledger</h3><p>'+
    (ledgerGoogle.configured()?'Sign in with the Google account that has access to your workbook.':'Use your existing Google app for live entries while the new connection is being set up.')+
    '</p><div class="actions">'+login+installed+sample+'</div></div><div class="bookWell" aria-hidden="true"><div class="bookCover"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4.5c3.5-1 6.5-.6 9 1.4 2.5-2 5.5-2.4 9-1.4v15c-3.6-.9-6.5-.5-9 1.2-2.5-1.7-5.4-2.1-9-1.2zM12 6v14M6 8.4l3 .5M15 8.9l3-.5"/></svg></div></div></section>';
  el('status').textContent=message||'Google Sheets connection';
}
async function signIn(){
  try { await ledgerGoogle.signIn(); await load(); }
  catch(error) { el('status').textContent=error.message; }
}
async function reconnect() {
  try { await ledgerGoogle.signIn(); el('err').textContent='Signed in. You can retry saving.'; }
  catch(error) { el('err').textContent=error.message; }
}
async function load(initial){
  const version=++loadVersion;
  el('status').textContent=preview?'Loading sample entries…':'Reading Google Sheet…';
  try{
    if(pages && !ledgerGoogle.authorized()) {
      await ledgerGoogle.prepare();
      if(version!==loadVersion)return;
      if(!data)welcome();
      else el('status').innerHTML='Google sign-in expired. '+btn('Reconnect','signIn()');
      return;
    }
    const next=initial || await call('state');
    if(version!==loadVersion)return;
    if(next.loadError)throw Error(next.loadError);
    if(next.connected===false){
      data=null; setView('Overview');
      el('tools').hidden=true;
      el('title').textContent='Personal & Business Ledger';
      el('status').textContent='Signed in as '+next.email;
      el('homeData').innerHTML='<div class="panel"><h3>Your ledger</h3>'+connectButtons()+'</div>';
      return;
    }
    const selected=el('scope').value;
    data=next;
    for(const button of document.querySelectorAll('.navRail button,.gear'))button.disabled=false;
    el('tools').hidden=false;
    const books=[...new Set([...data.books,...data.entries.map(row=>row.book)])];
    el('scope').innerHTML='<option value="">All books</option>'+options(books,selected);
    el('title').textContent=data.title;
    document.title=data.title;
    el('status').textContent=preview?'Preview · Sample data only':'Connected to Google Sheets';
    if(el('modal').open)return;
    if(currentView==='Reports' && el('report')){
      const reportBook=el('reportBook').value;
      el('reportBook').innerHTML='<option value="">All books</option>'+options(books,reportBook);
      reportData();
    }else if(currentView==='Accounts')accountsView(el('chartBook')?.value);
    else changeScope();
  }catch(e){
    if(version!==loadVersion)return;
    if(pages && !data){welcome(e.message);return;}
    el('status').textContent=(data?'Refresh failed. Showing the last loaded entries. ':'Could not read the ledger. ')+e.message;
  }
}
function connectButtons(){
  return btn('Connect Google Drive','connectDrive()',true)+btn('Open existing ledger','existingLedgerForm()');
}

function spendingByAccount(entries,month,book) {
  const accounts=new Map();
  let totalCents=0;
  entries.forEach((line,index)=>{
    if(line.sheetDraft || line.type!=='Expense' || !line.date.startsWith(month+'-') || (book && line.book!==book))return;
    const key=JSON.stringify([line.book,line.code]);
    if(!accounts.has(key))accounts.set(key,{name:line.name,code:line.code,book:line.book,cents:0,lines:[]});
    const account=accounts.get(key);
    const cents=Math.round(line.debit*100)-Math.round(line.credit*100);
    account.cents+=cents;
    totalCents+=cents;
    account.lines.push({line,index,cents});
  });
  const sorted=[...accounts.values()].sort((a,b)=>b.cents-a.cents || a.name.localeCompare(b.name) || a.book.localeCompare(b.book));
  for(const account of sorted)account.lines.sort((a,b)=>b.line.date.localeCompare(a.line.date) || b.index-a.index);
  return {totalCents,accounts:sorted};
}

function formatAmount(value){
  const parts=String(value??'').replace(/,/g,'').split('.');
  if(parts.length>2 || !/^\d*$/.test(parts[0]) || (parts.length===2 && !/^\d*$/.test(parts[1])))return String(value);
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return parts.join('.');
}
function formatTyping(input){
  const before=input.value,caret=input.selectionStart;
  const plainBefore=before.slice(0,caret).replace(/,/g,'').length;
  const after=formatAmount(before);
  if(after===before)return;
  input.value=after;
  let cursor=0,seen=0;
  while(cursor<after.length && seen<plainBefore){if(after[cursor]!==',')seen++;cursor++;}
  input.setSelectionRange(cursor,cursor);
}
function upperReference(input){
  const original=input.value,upper=original.toUpperCase();
  if(upper===original)return;
  const start=original.slice(0,input.selectionStart).toUpperCase().length;
  const end=original.slice(0,input.selectionEnd).toUpperCase().length;
  input.value=upper;input.setSelectionRange(start,end);
}

  rect(0,0,width,1230,'#ffffff');
  const grad=ctx.createLinearGradient(0,0,width,250);grad.addColorStop(0,navy);grad.addColorStop(1,violet);rect(0,0,width,235,grad);
  text('MONTHLY FINANCIAL REPORT',pad,54,17,700,'#dfebd8');fit(book,pad,130,inner,58,700,'#ffffff');
  text(periodLabel+(asOf?'   ·   Transactions through '+asOf:''),pad,182,23,400,'#f4eddf');
  rect(0,235,width,7,'#a8c7ad');
  let y=288;
  text('Closing bank balance',pad,y,24,600,teal);fit(money(opening+received-spent),pad,y+65,inner,62,700,ink);
  y+=96;rect(pad,y,inner,98,'#e8eddf');
  const metrics=[['Opening balance',opening],['Bank receipts',received],['Bank payments',spent]];
  metrics.forEach(([label,n],i)=>{const x=pad+18+i*inner/3;text(label,x,y+34,18,400,muted);fit(money(n),x,y+72,inner/3-32,27,700,ink)});
  y+=145;
  const wrap=(value,size,max)=>{font(size);const lines=[];let line='';for(const word of value.split(' ')){if(line&&ctx.measureText(line+' '+word).width>max){lines.push(line);line=word}else line+=(line?' ':'')+word}if(line)lines.push(line);return lines};
  const summary=openingFunds>0?'Bank receipts include '+money(openingFunds)+' in opening funds brought forward.':'Net change in bank balance for '+periodLabel+'  ·  '+money(received-spent)+'.';
  for(const line of wrap(summary,22,inner)){text(line,pad,y,22,400,muted);y+=30}
  y+=24;
  const detail=(title,total,items,empty)=>{
    rect(pad,y-20,6,31,'#6e9e88');text(title,pad+18,y+2,26,700,violet);
    y+=44;
    const rows=items.slice().sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
    const visible=rows.length>3?[...rows.slice(0,2),['Other accounts',rows.slice(2).reduce((sum,x)=>sum+x[1],0)]]:rows;
    if(!visible.length){text(empty,pad+4,y,20,400,muted);y+=32;}
    for(const [label,n] of visible){
      const end=money(n);font(22,600);const tw=ctx.measureText(end).width;fit(label,pad+4,y,inner-tw-28,21,400,ink);text(end,width-pad-tw,y,22,600,ink);
      rect(pad,y+12,inner,1,'#ded7c8');y+=45;
    }
    text('Total',pad+4,y,20,700,ink);font(23,700);const val=money(total);text(val,width-pad-ctx.measureText(val).width,y,23,700,ink);y+=64;
  };
  const sources=[],uses=[];
  for(const g of groups.values()){
    if(g.type==='Income')sources.push([/donat|contrib/i.test(g.name)?'Contributions':g.name,[...g.accounts.values()].reduce((sum,c)=>sum+c,0)/100]);
    else for(const [label,c] of g.accounts)uses.push([label,c/100]);
  }
  detail('Sources of income',income,sources,'No income recorded for this period.');
  detail('Expenditure by account',expense,uses,'No expenses recorded for this period.');
  rect(pad,y-17,inner,60,'#e8e3d5');text('Surplus / (deficit)',pad+16,y+21,20,600,violet);
  const result=money(income-expense);font(25,700);text(result,width-pad-16-ctx.measureText(result).width,y+22,25,700,violet);
  y+=82;
  text('Amounts in Lao kip',pad,y,16,500,muted);
  const footer=postedCount+' posted  ·  '+pending+' balanced drafts '+(basis==='Posted only'?'excluded':'included');
  font(16);text(footer,width-pad-ctx.measureText(footer).width,y,16,400,muted);
  const cropped=document.createElement('canvas');cropped.width=canvas.width;cropped.height=Math.ceil((y+34)*scale);
  cropped.getContext('2d').drawImage(canvas,0,0);return cropped.toDataURL('image/png');
}
function monthlyReport(book,month,clean=false,basis){
  basis=basis||el('monthBasis')?.value||el('reportBasis')?.value||'All balanced entries';
  book=book||el('reportBook')?.value||el('scope').value||(data.books.includes(data.reportBook)?data.reportBook:data.books[0]);
  month=month||data.today.slice(0,7);
  const chart=chartFor(book),accountMap=new Map(chart.filter(a=>a.use==='Posting').map(a=>[a.code,a]));
  const groupMap=new Map(chart.filter(a=>a.use==='Group').map(a=>[a.code,a.name]));
  const entries=data.entries.filter(r=>r.book===book),included=entries.filter(r=>basis!=='Posted only'||!r.sheetDraft);
  const period=r=>r.date.slice(0,7)===month,inMonth=included.filter(period);
  const banks=included.filter(r=>accountMap.get(r.code)?.role==='Bank');
  const opening=banks.filter(r=>r.date.slice(0,7)<month).reduce((s,r)=>s+Math.round(r.debit*100)-Math.round(r.credit*100),0)/100;
  const movement=banks.filter(period),sum=(lines,side)=>lines.reduce((s,r)=>s+Math.round(r[side]*100),0)/100;
  const received=sum(movement,'debit'),spent=sum(movement,'credit');
  const income=-net(inMonth,'Income'),expense=net(inMonth,'Expense'),groups=new Map();
  for(const r of inMonth){
    if(!['Income','Expense'].includes(r.type))continue;
    const parent=groupMap.get(accountMap.get(r.code)?.parent)||r.type;
    const key=r.type+'|'+parent, group=groups.get(key)||{type:r.type,name:parent,accounts:new Map()};groups.set(key,group);
    const delta=(Math.round(r.debit*100)-Math.round(r.credit*100))*(r.type==='Income'?-1:1);
    group.accounts.set(r.name,(group.accounts.get(r.name)||0)+delta);
  }
  const metric=(label,value)=>'<div><small>'+esc(label)+'</small><b>'+esc(amount(value))+'</b></div>';
  const periodLabel=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(month+'-01T00:00:00Z'));
  const postedCount=new Set(inMonth.filter(r=>!r.sheetDraft).map(r=>r.id)).size,pending=new Set(entries.filter(r=>r.sheetDraft&&period(r)).map(r=>r.id)).size;
  const latest=inMonth.reduce((max,r)=>r.date>max?r.date:max,'');
  const openingFunds=groupEntries(inMonth).reduce((total,lines)=>{
    const bankLines=lines.filter(l=>accountMap.get(l.code)?.role==='Bank');
    const other=lines.filter(l=>accountMap.get(l.code)?.role!=='Bank');
    if(!bankLines.length||!other.length||!other.every(l=>l.type==='Equity'&&/opening balance|beginning balance/i.test(l.name)))return total;
    return total+Math.max(0,sum(bankLines,'debit')-sum(bankLines,'credit'));
  },0);
  const details=[...groups.values()].sort((a,b)=>b.type.localeCompare(a.type)||a.name.localeCompare(b.name)).map(g=>'<h4>'+esc(g.name)+'</h4>'+[...g.accounts].sort((a,b)=>a[0].localeCompare(b[0])).map(([name,c])=>'<div class="rline"><span>'+esc(name)+'</span><b>'+esc(amount(c/100))+'</b></div>').join('')).join('');
  const command='monthlyReport(el(\'monthBook\').value,el(\'monthPeriod\').value';
  const controls='<div class="monthControls two" '+(clean?'hidden':'')+'>'+field('Ledger book','<select id="monthBook" onchange="'+command+')">'+options(data.books,book)+'</select>')+field('Reporting period','<input id="monthPeriod" type="month" value="'+esc(month)+'" onchange="if(this.value)'+command+')">')+field('Entry status','<select id="monthBasis" onchange="'+command+')">'+options(['All balanced entries','Posted only'],basis)+'</select>')+'</div>';
  const sheet='<article class="statement"><div class="statementHead"><small>MONTHLY FINANCIAL REPORT</small><h2>'+esc(book)+'</h2><p>'+esc(periodLabel)+' · Lao kip</p></div>'+
    '<section><h3>Bank balance and activity</h3><div class="closing"><span>Closing bank balance</span><strong>'+esc(amount(opening+received-spent))+'</strong></div><div class="metrics">'+metric('Opening balance',opening)+metric('Bank receipts',received)+metric('Bank payments',spent)+'</div></section>'+
    '<section><h3>Income and expenditure</h3><div class="metrics">'+metric('Total income',income)+metric('Total expenditure',expense)+metric('Surplus / (deficit)',income-expense)+'</div></section>'+
    '<section><h3>Income and expenditure by account</h3>'+(details||'<p>No income or expenses for this selection.</p>')+'</section>'+
    '<footer>Posted entries: '+postedCount+(pending?' · '+(basis==='Posted only'?'Balanced drafts excluded: ':'Balanced drafts included: ')+pending:'')+'</footer></article>';
  if(clean){
    const image=makeReportImage({book,periodLabel,asOf:displayDate(latest),opening,received,spent,income,expense,openingFunds,groups,postedCount,pending,basis});
    const file=(book+'-'+month+'-financial-update.png').replace(/[^a-z0-9._-]/gi,'-');
    const actions='<div class="actions"><a class="link" download="'+esc(file)+'" href="'+image+'">Save report image</a>'+btn('Show controls',command+',false)')+'</div>';
    dialog('Monthly report',controls+'<img class="statementImage" src="'+image+'" alt="Monthly financial report for '+esc(book)+'. Closing bank balance: '+esc(amount(opening+received-spent))+'">'+actions);
  }else dialog('Monthly report',controls+sheet+'<div class="actions">'+btn('Screenshot view',command+',true)',true)+'</div>');
  el('modal').classList.toggle('reportClean',clean);
}
function csv(name,rows){
  const escapeCell=value=>{
    let s=String(value??'');
    if(typeof value==='string'&&/^[\s]*[=+@-]/.test(s)) s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(escapeCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name+'.csv';
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),60000);
}

function downloadAccounts(){const book=el('chartBook').value;csv('Accounts - '+book,[['Book','Code','Account name','Classification','Parent code','Use','Cash / bank'],...chartFor(book).map(a=>[book,a.code,a.name,a.type,a.parent,a.use,a.role])]);}

function saveName(){write('renameLedger',[el('appName').value,data.ledgerId])}
const serverLedger = null;
const showMonthOnOpen = false;
load(serverLedger).then(()=>{if(showMonthOnOpen && data)monthlyReport()});
