<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f1ecdf"><title>Personal &amp; Business Ledger</title>
<style>:root {
  color-scheme: light;
  --paper: #f1ecdf;
  --face: #f6f1e6;
  --well: #e9e1d1;
  --ink: #282d28;
  --muted: #64655b;
  --teal: #075c58;
  --line: #d7cfbe;
  --raised: -3px -3px 7px #fffaf0, 3px 4px 8px #6e593d29;
  --inset: inset 2px 2px 4px #7967472b, inset -2px -2px 4px #fffaf1;
  font: 16px/1.5 Inter, "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); }
main { width: min(100%, 1176px); margin: auto; padding: 0 clamp(16px,4vw,56px) 48px; }
header,.row,.actions,.sectionHead,.brand,.filters,.brandMark,.navRail,.navRail button,.entryIcon { display: flex; align-items: center; }
header,.row,.sectionHead { justify-content: space-between; gap: 12px; }
.hero { padding: clamp(20px,4vw,43px) 0 22px; }
.brand { gap: 12px; min-width: 0; }
.brandMark,.entryIcon { justify-content: center; flex-shrink: 0; }
.brandMark { width: 45px; height: 45px; border-radius: 14px; color: var(--teal); background: var(--face); box-shadow: var(--raised); border: 1px solid #fff9e9; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brandMark img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
h1,h2,h3,h4,p { margin-top: 0; }
h1 { font-size: clamp(19px,2.4vw,29px); line-height: 1.16; letter-spacing: -.047em; margin: 0; overflow-wrap: anywhere; }
h2 { font-size: clamp(21px,2.6vw,32px); letter-spacing: -.045em; line-height: 1.2; margin: 0; }
h3 { font-size: 17px; letter-spacing: -.025em; }
button,.link,select,input { font: inherit; color: var(--ink); }
button,.link { border: 1px solid #dfd8c9; background: var(--face); border-radius: 12px; padding: 9px 15px; min-height: 42px; cursor: pointer; box-shadow: var(--raised); font-size: 14px; font-weight: 620; touch-action: manipulation; }
.link { display: inline-flex; align-items: center; text-decoration: none; }
button:enabled:hover,.link:hover { background: #faf6eb; border-color: #bdb5a3; }
button:enabled:active,.link:active { box-shadow: var(--inset); }
button:disabled,select:disabled,input:disabled { opacity: .57; cursor: default; box-shadow: none; }
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible { outline: 3px solid #36857b; outline-offset: 3px; }
.primary,button.primary:hover,.link.primary:hover { background: var(--teal); color: #fffdf4; border-color: #0a5a55; border-radius: 30px; padding-inline: 20px; }
button.gear { display: grid; place-items: center; width: 44px; padding: 0; color: var(--teal); border-radius: 14px; }
.navRail { gap: 6px; padding: 6px; background: #ebe5d8; box-shadow: var(--inset); border-radius: 16px; }
.navRail button { position: relative; justify-content: center; gap: 9px; flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 11px; background: transparent; box-shadow: none; color: #535950; padding-inline: 8px; }
.navRail button:hover { background: #f0eadf; }
.navRail button[aria-current=page] { border-color: #e8e0cf; background: var(--face); color: var(--teal); box-shadow: var(--raised); }
.navRail button[aria-current=page]::after { content: ""; position: absolute; width: 24px; height: 2px; bottom: 2px; background: var(--teal); border-radius: 4px; }
.navRail svg { width: 18px; height: 18px; }
.sectionHead { align-items: end; margin: 29px 0 17px; flex-wrap: wrap; }
.sectionHead h2 { margin-bottom: 2px; }
.status,.sub,.muted,small { color: var(--muted); font-size: 13px; }
.status { min-height: 1.5em; }
.filters,.actions,.wrap { flex-wrap: wrap; gap: 10px; }
.filters label { margin: 0; }
.filters select { min-height: 41px; width: auto; min-width: 128px; }
.filters button { margin-left: auto; }
.sectionHead > .compactTools { flex: 1 0 100%; width: 100%; display: flex; flex-wrap: nowrap; gap: 8px; }
.sectionHead .compactTools > select { flex: 1 1 auto; width: 0; min-width: 0; max-width: none; height: 44px; }
.compactTools .toolIcon { flex: 0 0 44px; width: 44px; height: 44px; padding: 0; margin: 0; border-radius: 12px; }
.compactTools .primary { padding: 0; }
.viewActions { display: flex; flex: 0 0 auto; gap: 8px; }
.reportTop { margin-bottom: 14px; }
.downloadSummary { margin: 16px 0; padding: 14px; border: 1px solid var(--line); border-radius: 12px; }
.downloadSummary h3 { margin-bottom: 8px; }
.downloadSummary .rline { align-items: baseline; font-size: 14px; }
.downloadSummary strong { text-align: right; }
.reportDownloads { justify-content: start; margin: 12px 0; }
.reportGroup { background: #e0efe8; font-weight: 700; }
.reportTotal { background: #eee8d9; font-weight: 700; border-block: 1px solid #b6c8bc; }
.assetChoices { padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin-block: 12px; }
.assetChoices summary { cursor: pointer; font-weight: 650; }
.assetChoices label { display: flex; align-items: center; gap: 10px; margin: 8px 0; min-height: 44px; }
.assetChoices input { width: 20px; height: 20px; min-height: 20px; margin: 0; padding: 0; flex: none; }
.downloadChoices { display: grid; gap: 12px; }
.iconButton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0; }
label span.sub { display: block; }
input,select { background: #f1ecdf; box-shadow: var(--inset); border: 1px solid #c8bfae; border-radius: 10px; min-height: 44px; padding: 8px 11px; min-width: 0; max-width: 100%; }
label input,label select { display: block; margin-top: 5px; width: 100%; font-size: 16px; font-weight: 450; }
select { text-overflow: ellipsis; }
.panel,dialog,.workPanel,.entryPanel { border: 1px solid #e2dac9; background: var(--face); border-radius: 19px; box-shadow: var(--raised); }
.panel,.workPanel,.entryPanel { padding: clamp(16px,2.4vw,28px); margin: 18px 0; }
.overviewGrid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(0,1fr); gap: 16px; }
.overviewGrid .panel { margin: 0; }
.balance { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(20px,3.3vw,34px); border-left: 4px solid var(--teal); }
.balanceLabel,.summaryLine,.entry { display: flex; align-items: center; gap: 12px; }
.balanceLabel { color: var(--teal); font-weight: 680; }
.kpi { font-size: clamp(30px,5vw,59px); font-weight: 620; color: var(--teal); letter-spacing: -.062em; line-height: 1.16; margin: 14px 0 6px; overflow-wrap: anywhere; }
.money,.kpi,.metrics,.rline,table,.summaryLine strong { font-variant-numeric: tabular-nums; }
.summaryLine { justify-content: space-between; padding: 13px 0; }
.summaryLine+.summaryLine { border-top: 1px solid var(--line); }
.summaryLine span { color: var(--muted); }
.summaryLine strong { font-size: clamp(15px,2.2vw,22px); overflow-wrap: anywhere; }
.sectionHead.compact { align-items: center; margin: 0 0 10px; }
.sectionHead.compact h3 { margin: 0; font-size: 19px; }
.textButton { background: none; border-color: transparent; box-shadow: none; color: var(--teal); padding-inline: 7px; }
.entryPanel { padding-bottom: 8px; }
.item { display: block; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; box-shadow: none; width: 100%; padding: 13px 2px; text-align: left; }
.item:first-child { border-top: 0; }
.item:hover { border-color: var(--line); }
.entry { width: 100%; }
.entryIcon { height: 36px; width: 36px; background: #e9e9d9; color: var(--teal); border-radius: 11px; }
.entryText { flex: 1; min-width: 0; }
.entryText small { display: block; font-weight: 450; }
.item strong,.item small,.money { overflow-wrap: anywhere; }
.empty { text-align: center; margin: 18px 0; padding: 22px 14px; border: 1px dashed #bdb6a6; border-radius: 12px; color: var(--muted); }
.accessPanel { max-width: 440px; margin: clamp(32px,10vh,100px) auto; padding: clamp(24px,4vw,40px); }
.accessPanel h2 { margin-bottom: 12px; }
.accessPanel p { color: var(--muted); overflow-wrap: anywhere; }
.accessPanel p:empty { display: none; }
#accessActions { display: grid; gap: 10px; }
#accessActions:empty { display: none; }
#accessActions button { width: 100%; }
.status:empty { display: none; }
dialog { width: min(640px,calc(100vw - 28px)); max-height: min(90dvh,880px); padding: clamp(18px,3vw,28px); color: var(--ink); box-shadow: 0 16px 64px #40382045, inset 1px 1px 1px #fff9ec; }
dialog::backdrop { background: #38362955; }
dialog header { padding-bottom: 13px; border-bottom: 1px solid var(--line); }
dialog header button { min-width: 42px; padding: 3px 11px; font-size: 23px; }
.body { margin: 17px 0 0; }
.body > button,.workPanel > button { margin: 3px 8px 5px 0; }
.actions { display: flex; align-items: center; justify-content: flex-end; margin-top: 16px; }
.actions:first-child { margin-top: 0; margin-bottom: 14px; }
.two { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 4px 12px; }
.line { padding: 8px 14px 14px; margin: 14px 0; background: #eee8db; border: 1px solid var(--line); border-radius: 13px; }
summary { cursor: pointer; color: var(--teal); }
.notice { color: #873a29; overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 10px; }
.notice:empty { display: none; }
.table { max-width: 100%; overflow: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th,td { padding: 10px; text-align: right; border-bottom: 1px solid var(--line); }
th { background: #e9e3d5; color: #424d44; white-space: nowrap; }
td:first-child,th:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
.statement { font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fffcf4; }
.statementHead { padding: 20px; color: #fffaf0; background: #175b56; }
.statementHead small,.statementHead p { color: #f0e9da; }
.statementHead h2 { margin: 4px 0; }
.statementHead p { margin: 0; }
.statement section,.statement footer { padding: 16px 20px; }
.statement section+section,.statement footer { border-top: 1px solid var(--line); }
.statement h3,.statement h4 { color: var(--teal); margin: 0 0 10px; }
.statement h4 { margin-top: 12px; }
.closing { padding: 12px 15px; background: #e4ebe0; border-left: 3px solid var(--teal); margin-bottom: 12px; }
.closing span,.closing strong,.metrics small,.metrics b { display: block; }
.closing strong { font-size: 25px; }
.metrics { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
.metrics b { overflow-wrap: anywhere; }
.rline { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 5px 0; }
.expenseHeading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 15px; }
.expenseHeading h3,.expenseHeading label { margin: 0; }
.expenseAccount { border-top: 1px solid var(--line); }
.expenseAccount summary { display: flex; align-items: center; gap: 12px; padding: 12px 2px; min-height: 48px; }
.expenseAccount summary::-webkit-details-marker { display: none; }
.expenseAccount summary::before { content: ""; flex: none; width: 7px; height: 7px; border: solid var(--teal); border-width: 0 2px 2px 0; transform: rotate(-45deg); }
.expenseAccount[open] summary::before { transform: rotate(45deg); }
.expenseAccount .entry { min-width: 0; }
.expenseAccount .entryText { overflow-wrap: anywhere; }
.expenseAccount .item { padding-left: 20px; }
.statement footer { font-size: 12px; color: var(--muted); }
.statementImage { width: 100%; height: auto; display: block; }
.reportClean { padding: 8px; }
.reportClean .body { margin: 0; }
.reportClean>header { display: none; }
@media (max-width:640px) {
  main { padding-inline: 15px; }
  .hero { padding: 20px 0 16px; }
  .brand { gap: 9px; }
  .brandMark { width: 38px; height: 38px; border-radius: 11px; }
  .navRail { gap: 2px; padding: 4px; }
  .navRail button { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 1px; min-height: 49px; }
  .navRail button[aria-current=page]::after { bottom: 1px; }
  .sectionHead { margin: 21px 0 14px; }
  .overviewGrid { grid-template-columns: 1fr; gap: 12px; }
  .totals { display: grid; grid-template-columns: 1fr 1fr; padding: 14px 16px; }
  .summaryLine { display: grid; gap: 2px; padding: 0; }
  .summaryLine+.summaryLine { border: 0; border-left: 1px solid var(--line); padding-left: 16px; }
  .entryIcon { width: 30px; height: 33px; }
  .entry { gap: 8px; }
  .entry .money { max-width: 40%; }
  .entryText small { font-size: 11px; }
  .filters { gap: 6px; }
  .filters select { min-width: 0; max-width: 46vw; }
}
@media (max-width:390px) {
  h1 { font-size: 17px; }
  .two { gap: 6px; }
  .metrics { grid-template-columns: 1fr; }
  .entryIcon { display: none; }
}
@media print {
  body,main,.statement { background: white; }
  button,.navRail,.gear,.actions { display: none; }
  .panel,.workPanel,.entryPanel { box-shadow: none; }
}

.sessionFrame { position: fixed; left: -8px; top: 0; width: 1px; height: 1px; border: 0; pointer-events: none; }

.loginBrand { display: none; }
.loginPage { background: radial-gradient(ellipse at top left, #244d40, #10392d 56%, #09271e); }
.loginPage main { min-height: 100dvh; display: grid; align-content: center; justify-items: center; padding: 20px 16px; }
.loginPage .hero, .loginPage footer { display: none; }
.loginPage #access { width: min(380px,100%); margin: 0; padding: 24px; border-radius: 18px; background: var(--face); box-shadow: 0 18px 50px #001e1850; }
.loginPage .loginBrand { display: flex; align-items: center; gap: 8px; color: var(--teal); font-size: .86rem; font-weight: 700; margin-bottom: 14px; }
.loginBrand img { display: block; border-radius: 7px; }
.loginPage #access h2 { color: var(--ink); font-size: 25px; margin-bottom: 18px; }
.loginPage #accessMessage { font-size: .88rem; line-height: 1.4; margin: -8px 0 14px; }
.loginPage #access form { display: grid; gap: 12px; }
.loginPage #access label { display: grid; gap: 5px; margin: 0; }
.loginPage #access input { min-height: 44px; font-size: 16px; margin-top: 0; }
.loginPage #access .passwordWrap { margin-top: 0; }
.loginPage #access .primary { min-height: 44px; margin-top: 4px; }
.loginLinks { display: flex; justify-content: flex-end; margin-top: 2px; }
#accessActions .loginLinks button { width: auto; padding: 4px 0; min-height: 34px; border: 0; color: var(--teal); background: transparent; box-shadow: none; font-size: 13px; font-weight: 500; }
#accessActions .loginFoot button { font-weight: 500; }
.usageRed{color:#a62c29}.usageAmber{color:#885700}
.bookGrants { margin: 16px 0; padding: 8px 16px 16px; border: 1px solid var(--line); border-radius: 12px; }
.bookGrants legend { padding: 0 6px; color: var(--teal); font-weight: 650; }
.bookGrant { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); align-items: center; gap: 12px; padding: 4px 0; }
.bookGrant label { display: flex; align-items: center; gap: 9px; min-height: 44px; margin: 0; overflow-wrap: anywhere; cursor: pointer; }
.bookGrant input { width: 20px; height: 20px; min-height: 20px; margin: 0; padding: 0; flex: none; accent-color: var(--teal); }
.bookGrant select:disabled { opacity: .55; }
@media(max-width:420px){ .bookGrant { grid-template-columns: 1fr; gap: 0; } }

/* Shared navigation and forms for the ledger settings screens. */
.settingsScreen { --settings-pad: clamp(18px,3vw,30px); width: min(560px,calc(100vw - 32px)); padding: 0; background: var(--paper); }
.settingsScreen.settingsHome { width: min(820px,calc(100vw - 32px)); }
.settingsScreen header { position: sticky; z-index: 1; top: 0; justify-content: start; padding: 14px var(--settings-pad); background: var(--paper); }
.settingsScreen header h2 { flex: 1; min-width: 0; font-size: clamp(21px,3vw,27px); outline: none; overflow-wrap: anywhere; }
.settingsScreen header button { flex: none; border: 0; background: transparent; box-shadow: none; color: var(--teal); width: 44px; height: 44px; padding: 0; }
.settingsScreen #settingsBack { font-size: 32px; margin-left: -10px; }
.settingsScreen .body { padding: 20px var(--settings-pad) 24px; margin: 0; }
.settingsScreen #err:not(:empty) { padding: 0 var(--settings-pad) 18px; margin: 0; }
.settingsGrid { display: grid; gap: 20px; }
.settingsGrid > div { min-width: 0; }
.settingsGrid > div:empty { display: none; }
.settingGroup + .settingGroup,.settingsScreen .settingList + .settingGroup { margin-top: 20px; }
.settingGroup h3 { font-size: 13px; font-weight: 680; letter-spacing: .01em; color: var(--teal); margin: 0 0 7px 4px; }
.settingList,.settingsBooks { border: 1px solid var(--line); border-radius: 15px; background: #fffaf0; }
.settingList > :first-child { border-radius: 14px 14px 0 0; }
.settingList > :last-child { border-radius: 0 0 14px 14px; }
.settingList > :only-child { border-radius: 14px; }
.settingRow { display: grid; grid-template-columns: 28px minmax(0,1fr) 12px; align-items: center; gap: 12px; min-height: 52px; width: 100%; padding: 11px 14px; text-align: start; background: transparent; border: 0; border-radius: 0; box-shadow: none; color: var(--ink); text-decoration: none; }
.settingList > * + * { border-top: 1px solid var(--line); }
.settingRow:hover:not(:disabled) { background: #f5f0e4; }
.settingIcon { display: grid; place-items: center; color: var(--teal); }
.settingText strong,.settingText small { display: block; overflow-wrap: anywhere; }
.settingText strong,.settingInfo strong { font-size: 15px; font-weight: 600; }
.settingText small { margin-top: 2px; font-weight: 400; }
.settingArrow { justify-self: end; color: var(--muted); font-size: 22px; line-height: 1; }
.settingRow:disabled { opacity: .7; }
.settingInfo { display: grid; padding: 13px 16px; gap: 2px; margin: 0; overflow-wrap: anywhere; }
.settingsScreen label { margin: 0 0 16px; }
.settingsScreen form button.primary { min-height: 46px; }
.settingsScreen .body > .sub:last-child { margin: 16px 0 0; }
.settingsBooks { margin: 0 0 18px; padding: 0; list-style: none; }
.settingsBooks li { padding: 10px 15px; overflow-wrap: anywhere; }
.settingsBooks li + li { border-top: 1px solid var(--line); }
.settingsScreen .bookGrants { padding: 4px 12px 8px; min-width: 0; background: #fffaf0; }
.settingsScreen .bookGrant { grid-template-columns: minmax(0,1fr) minmax(98px,40%); gap: 8px; }
.settingsScreen .bookGrant + .bookGrant { border-top: 1px solid var(--line); }
.settingsScreen .bookGrant label { margin: 0; padding: 5px 0; }
.settingsScreen .bookGrant select { width: 100%; }
.settingsScreen .revokePerson { color: #963d33; box-shadow: none; margin-top: 14px; }
.settingsScreen progress { display: block; width: 100%; margin: 12px 0; accent-color: var(--teal); }
@media(min-width:700px){ .settingsGrid:has(> div:nth-child(2):not(:empty)) { grid-template-columns: repeat(2,minmax(0,1fr)); align-items: start; gap: 24px; } }
@media(max-width:640px){
  dialog.settingsScreen,dialog.settingsHome { margin: 0; inset: 0; width: 100%; max-width: none; height: 100%; height: 100dvh; max-height: none; border: 0; border-radius: 0; overscroll-behavior: contain; }
  .settingsScreen header { padding-top: max(8px,env(safe-area-inset-top)); padding-bottom: 8px; }
  .settingsScreen .body { padding-bottom: max(24px,env(safe-area-inset-bottom)); }
  .settingsScreen form .primary,.settingsScreen .revokePerson { width: 100%; }
}

.passwordWrap { position: relative; display: block; width: 100%; margin-top: 5px; }
.passwordWrap input { width: 100%; margin-top: 0; padding-right: 54px; }
.passwordWrap .passwordEye, #accessActions .passwordEye { position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 44px; min-width: 44px; height: 44px; padding: 10px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px; background: transparent; color: var(--teal); box-shadow: none; }
.passwordEye:focus-visible { outline: 2px solid var(--teal); outline-offset: -3px; }
.emailPreview { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--face); }
</style>
</head><body>
<main>
  <header class="hero"><div class="brand"><div class="brandMark"><img src="https://santos-cabbigat.github.io/Personal-Ledger/ledger-icon.png?v=forest1" alt="" width="45" height="45"></div><h1 id="title">Personal &amp; Business Ledger</h1></div><button id="settingsButton" hidden class="gear" aria-label="Settings" onclick="settings()"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m10 3 .5-1h3l.5 2 2 .9 1.9-.6 1.7 2.5-1.2 1.6.5 2.1 1.8 1v2.7l-2 .7-.9 2 1 1.7-2.4 2-1.7-.9-2 .5-.8 1.8h-3l-.6-2-2-.7-1.7.9-2-2.3.9-1.7-.6-2L2 13v-2.6l2-.8.8-2-1-1.7L6.2 4l1.8.9 2-.8z"/><circle cx="12" cy="12" r="3"/></svg></button></header>
  <section id="access" class="panel accessPanel" aria-labelledby="accessTitle">
    <span class="loginBrand"><img src="ledger-icon.png?v=forest1" width="28" height="28" alt="">Personal Ledger</span>
    <h2 id="accessTitle">Opening your ledger…</h2>
    <p id="accessMessage" role="status"></p>
    <div id="accessActions"></div>

let loginMode='login';

  const title=reset?'New password':forgot?'Reset password':'Sign in';

  const pass=forgot?'':field('Password',passwordInput('loginPassword','autocomplete="'+(reset?'new-password':'current-password')+'" placeholder="Password" required'));
  const help=forgot?'Enter your email to receive a reset link.':reset?'Choose a new password.':'';
  accessScreen(title,message||help,'<form onsubmit="event.preventDefault();submitLogin()">'+email+pass+'<button class="primary" type="submit">'+(reset?'Save password':forgot?'Send reset link':'Sign in')+'</button></form>'+

async function submitLogin(){
  const email=el('loginEmail')?.value.trim(),password=el('loginPassword')?.value,mode=loginMode;

    if(mode==='forgot'){await ledgerDb.forgot(email);loginScreen('Check your inbox for a password reset link.');return;}
    if(mode==='reset'){await ledgerDb.password(password);history.replaceState(null,'',location.pathname);}

async function signOut(){++loadVersion;try{await ledgerDb.signOut();}finally{resetLedger();loginScreen();}}

async function load(initial,fresh=false){
  const version=++loadVersion;

  try{
    if(pages){
      const session=await ledgerDb.session();if(version!==loadVersion)return;
      if(!session){resetLedger();loginScreen();return;}
      if(new URLSearchParams(location.search).get('reset')==='1'){loginScreen('Enter a new password.','reset');return;}
      document.body.classList.remove('loginPage');
    }
    const next=initial || await call('state');
    if(version!==loadVersion)return;
    if(next.loadError)throw Error(next.loadError);
    if(next.connected===false){accessScreen('Open your ledger','Choose your workbook.',connectButtons());return;}
    const selected=el('scope').value;
    if(data && !data.owner && (JSON.stringify(data.books)!==JSON.stringify(next.books) || JSON.stringify(data.editableBooks)!==JSON.stringify(next.editableBooks))){
      resetLedger();
    }
    data=next;
    lastReadAt=Date.now();
    el('access').hidden=true;
    el('dashboard').hidden=false;
    el('ledgerNav').inert=false;
    el('settingsButton').hidden=false;
    el('tools').hidden=false;
    const books=[...new Set([...data.books,...data.entries.map(row=>row.book)])];
    el('scope').innerHTML='<option value="">All books</option>'+options(books,selected);
    el('title').textContent=data.title;
    document.title=data.title;
    el('status').textContent=preview?'Preview · Sample data only':'';
    if(el('modal').open)return;
    if(currentView==='Reports' && el('report')){
      const reportBook=el('reportBook').value;
      el('reportBook').innerHTML='<option value="">All books</option>'+options(books,reportBook);
      reportData();
    }else if(currentView==='Accounts')accountsView(el('chartBook')?.value);
    else changeScope();
  }catch(e){
    if(version!==loadVersion)return;
    if(data && pages && !data.owner){resetLedger();}
    if(!data){
      accessScreen('Couldn’t open your ledger',e.message,btn('Try again','load()',true)+(pages?btn('Sign out','signOut()')+recoveryLink(e):''));
      return;
    }
    el('status').textContent=(data?'Refresh failed. Showing the last loaded entries. ':'Could not read the ledger. ')+e.message;
  }finally{if(version===loadVersion)refreshInProgress=false;}
}

}

let pendingAccessEmail=null;

function accessEmailPreview(details){

    field('To','<input type="email" readonly value="'+esc(message.to)+'">')+

async function sendAccessEmail(){

function spendingByAccount(entries,month,book) {
  const accounts=new Map();
  let totalCents=0;
  entries.forEach((line,index)=>{
    if(line.sheetDraft || line.type!=='Expense' || !line.date.startsWith(month+'-') || (book && line.book!==book))return;
    const key=JSON.stringify([line.book,line.code]);
    if(!accounts.has(key))accounts.set(key,{name:line.name,code:line.code,book:line.book,cents:0,lines:[]});
    const account=accounts.get(key);
    const cents=Math.round(line.debit*100)-Math.round(line.credit*100);
    account.cents+=cents;
    totalCents+=cents;
    account.lines.push({line,index,cents});
  });
  const sorted=[...accounts.values()].sort((a,b)=>b.cents-a.cents || a.name.localeCompare(b.name) || a.book.localeCompare(b.book));
  for(const account of sorted)account.lines.sort((a,b)=>b.line.date.localeCompare(a.line.date) || b.index-a.index);
  return {totalCents,accounts:sorted};
}

function formatAmount(value){
  const parts=String(value??'').replace(/,/g,'').split('.');
  if(parts.length>2 || !/^\d*$/.test(parts[0]) || (parts.length===2 && !/^\d*$/.test(parts[1])))return String(value);
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return parts.join('.');
}
function formatTyping(input){
  const before=input.value,caret=input.selectionStart;
  const plainBefore=before.slice(0,caret).replace(/,/g,'').length;
  const after=formatAmount(before);
  if(after===before)return;
  input.value=after;
  let cursor=0,seen=0;
  while(cursor<after.length && seen<plainBefore){if(after[cursor]!==',')seen++;cursor++;}
  input.setSelectionRange(cursor,cursor);
}
function upperReference(input){
  const original=input.value,upper=original.toUpperCase();
  if(upper===original)return;
  const start=original.slice(0,input.selectionStart).toUpperCase().length;
  const end=original.slice(0,input.selectionEnd).toUpperCase().length;
  input.value=upper;input.setSelectionRange(start,end);
}

  const metric=(label,value)=>'<div><small>'+esc(label)+'</small><b>'+esc(amount(value))+'</b></div>';
  const periodLabel=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(month+'-01T00:00:00Z'));
  const postedCount=groupEntries(inMonth.filter(r=>!r.sheetDraft)).reduce((total,[row])=>total+(row.entryCount||1),0),pending=new Set(entries.filter(r=>r.sheetDraft&&period(r)).map(r=>r.id)).size;
  const latest=inMonth.reduce((max,r)=>r.date>max?r.date:max,'');
  const openingFunds=groupEntries(inMonth).reduce((total,lines)=>{
    if(lines[0].summary)return total+Number(lines[0].openingAmount||0);
    const bankLines=lines.filter(l=>accountMap.get(l.code)?.role==='Bank');
    const other=lines.filter(l=>accountMap.get(l.code)?.role!=='Bank');
    if(!bankLines.length||!other.length||!other.every(l=>l.type==='Equity'&&/opening balance|beginning balance/i.test(l.name)))return total;
    return total+Math.max(0,sum(bankLines,'debit')-sum(bankLines,'credit'));
  },0);
  const details=[...groups.values()].sort((a,b)=>b.type.localeCompare(a.type)||a.name.localeCompare(b.name)).map(g=>'<h4>'+esc(g.name)+'</h4>'+[...g.accounts].sort((a,b)=>a[0].localeCompare(b[0])).map(([name,c])=>'<div class="rline"><span>'+esc(name)+'</span><b>'+esc(amount(c/100))+'</b></div>').join('')).join('');
  const command='monthlyReport(el(\'monthBook\').value,el(\'monthPeriod\').value';
  const controls='<div class="monthControls two" '+(clean?'hidden':'')+'>'+field('Ledger book','<select id="monthBook" onchange="'+command+')">'+options(data.books,book)+'</select>')+field('Reporting period','<input id="monthPeriod" type="month" value="'+esc(month)+'" onchange="if(this.value)'+command+')">')+field('Entry status','<select id="monthBasis" onchange="'+command+')">'+options(['All balanced entries','Posted only'],basis)+'</select>')+'</div>';
  monthlyExport=LedgerDownloads.monthly(data,{book,month,basis});
  const monthlyDownloads=btn('Download monthly report CSV','downloadMonthly()')+btn('Excel · highlighted',"downloadMonthly('xlsx')");
  const sheet='<article class="statement"><div class="statementHead"><small>MONTHLY FINANCIAL REPORT</small><h2>'+esc(book)+'</h2><p>'+esc(periodLabel)+' · Lao kip</p></div>'+
    '<section><h3>Bank balance and activity</h3><div class="closing"><span>Closing bank balance</span><strong>'+esc(amount(opening+received-spent))+'</strong></div><div class="metrics">'+metric('Opening balance',opening)+metric('Bank receipts',received)+metric('Bank payments',spent)+'</div></section>'+
    '<section><h3>Income and expenditure</h3><div class="metrics">'+metric('Total income',income)+metric('Total expenditure',expense)+metric('Surplus / (deficit)',income-expense)+'</div></section>'+
    '<section><h3>Income and expenditure by account</h3>'+(details||'<p>No income or expenses for this selection.</p>')+'</section>'+
    '<footer>Posted entries: '+postedCount+(pending?' · '+(basis==='Posted only'?'Balanced drafts excluded: ':'Balanced drafts included: ')+pending:'')+'</footer></article>';
  if(clean){
    const image=makeReportImage({book,periodLabel,asOf:displayDate(latest),opening,received,spent,income,expense,openingFunds,groups,postedCount,pending,basis});
    const file=(book+'-'+month+'-financial-update.png').replace(/[^a-z0-9._-]/gi,'-');
    const actions='<div class="actions"><a class="link" download="'+esc(file)+'" href="'+image+'">Save report image</a>'+monthlyDownloads+btn('Show controls',command+',false)')+'</div>';
    dialog('Monthly report',controls+'<img class="statementImage" src="'+image+'" alt="Monthly financial report for '+esc(book)+'. Closing bank balance: '+esc(amount(opening+received-spent))+'">'+actions);
  }else dialog('Monthly report',controls+sheet+'<div class="actions">'+monthlyDownloads+btn('Screenshot view',command+',true)',true)+'</div>');
  el('modal').classList.toggle('reportClean',clean);
}
function csv(name,rows){
  const escapeCell=value=>{
    let s=String(value??'');
    if(typeof value==='string'&&/^[\s]*[=+@-]/.test(s)) s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(escapeCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name+'.csv';
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),60000);
}
function saveReport(model,format='csv'){
  if(!data||!model)return;
  const name=[model.name,model.scope.book,model.scope.month||[model.scope.from,model.scope.to].filter(Boolean).join('-')].filter(Boolean).join(' - ').replace(/[\\/:*?"<>|]/g,'-');
  if(format==='csv')return csv(name,LedgerDownloads.rows(model));
  const url=URL.createObjectURL(LedgerDownloads.xlsx(model)),link=document.createElement('a');link.href=url;link.download=name+'.xlsx';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function openDownload(){

  else if(currentView==='Accounts')downloadExport=LedgerDownloads.accounts(data,el('chartBook').value);
  else if(currentView==='Expense')downloadExport=LedgerDownloads.expense(data.entries,{book:el('scope').value,month:expenseMonth});
  else return;
  if(!downloadExport){el('status').textContent='Choose valid report filters before downloading.';return;}
  const m=downloadExport;dialog('Download '+m.name.toLowerCase(),'<p class="sub">'+esc(Object.values(m.scope).join(' · '))+'</p><p>Every download includes a summary. Excel also highlights each group’s first line and its totals.</p><div class="downloadChoices">'+btn('Download '+m.name.toLowerCase()+' CSV',"saveReport(downloadExport,'csv')")+btn('Download formatted Excel',"saveReport(downloadExport,'xlsx')",true)+'</div>');
}

async function storageSettings(){

      '<progress max="100" value="'+Math.min(100,pct)+'" aria-label="Database usage"></progress><p>'+Math.round(result.bytes/1048576)+' of '+Math.round(result.limitBytes/1048576)+' MiB used</p>'+
      '<div class="settingList"><div class="settingInfo"><small>Last verified archive</small><strong>'+esc(result.lastArchive?new Date(result.lastArchive).toLocaleString():'Awaiting first archive')+
      '</strong></div><div class="settingInfo"><small>Revisions waiting</small><strong>'+esc(result.pending)+'</strong></div></div>';

async function savePerson(index,prepareEmail=false){
  if(locked)return;
  const books={},email=el('personEmail').value.trim().toLowerCase(),password=el('personPass').value;
  data.books.forEach((book,i)=>{if(el('includeBook'+i).checked)books[book]=el('grant'+i).value;});
  if(!Object.keys(books).length){el('err').textContent='Choose access for at least one book.';return;}
  const payload={email,books,version:people[index]?.version};
  locked=true;
  try{
    if(password)await ledgerDb.provisionReviewer({...payload,password});
    else await call('saveAccess',payload);
    if(prepareEmail){
      const members=await call('listAccess'),member=members.find(p=>p.email===email);
      if(!member)throw Error('Access saved. Reopen the person to prepare their email.');
      accessEmailPreview({email,password,books,sender:data.email,version:member.version});
    }
    else{await peopleSettings();el('err').textContent='Access saved.';}
  }catch(e){el('err').textContent=e.message;}finally{locked=false;}
}
