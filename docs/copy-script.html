<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copy ledger script</title><style>body{background:#11182b;color:#edf4ff;font:18px system-ui;margin:8vh auto;max-width:560px;padding:20px}button{font:inherit;padding:16px;border-radius:12px;background:#a6eaff;color:#102137;border:0}textarea{width:100%;height:9em}</style><h1>Ledger script</h1><p>Copy the complete app into Code.gs in your ledger’s Apps Script editor.</p><button id="copy">Copy entire script</button><p role="status" id="result"></p><textarea hidden readonly id="code" aria-label="Complete script"></textarea><script>const template="function ledgerId_() {\n  const properties = PropertiesService.getScriptProperties();\n  const id = properties.getProperty('LEDGER_ID');\n  if (!id) throw Error('The owner must initialize this spreadsheet from its Ledger menu first.');\n  return id;\n}\nfunction initializeLedger() {\n  const sheet = SpreadsheetApp.getActiveSpreadsheet();\n  if (!sheet || sheet.getOwner().getEmail() !== Session.getEffectiveUser().getEmail()) throw Error('Only the spreadsheet owner may initialize the ledger.');\n  if (!['Settings','Overview','Journal','Accounts'].every(name=>sheet.getSheetByName(name))) throw Error('Open the prepared ledger workbook.');\n  PropertiesService.getScriptProperties().setProperty('LEDGER_ID', sheet.getId());\n  openLedger();\n}\nconst TYPES = ['Asset','Liability','Equity','Income','Expense'];\nconst BOOKS = ['Personal','Business'];\nfunction onOpen() {\n  SpreadsheetApp.getUi().createMenu('Ledger').addItem('Initialize ledger','initializeLedger').addItem('Open ledger','openLedger').addToUi();\n}\nfunction openLedger() {\n  SpreadsheetApp.getUi().showSidebar(page_().setTitle('Ledger'));\n}\nfunction doGet() { return page_(); }\nfunction page_() {\n  return HtmlService.createHtmlOutput(LEDGER_HTML_).setTitle('Shared ledger').addMetaTag('viewport','width=device-width, initial-scale=1, viewport-fit=cover');\n}\nfunction context_() {\n  const email = Session.getActiveUser().getEmail().toLowerCase();\n  if (!email || email !== Session.getEffectiveUser().getEmail().toLowerCase()) throw Error('Open the ledger while signed in with your invited Google account.');\n  const sheet = SpreadsheetApp.openById(\"__WORKBOOK__\");\n  const owner = sheet.getOwner().getEmail().toLowerCase();\n  return { sheet, email, owner };\n}\nfunction rows_(sheet, name, columns) {\n  const tab = sheet.getSheetByName(name);\n  if (!tab) throw Error('Missing sheet: '+name);\n  const count = tab.getLastRow()-1;\n  return count>0 ? tab.getRange(2,1,count,columns).getValues() : [];\n}\nfunction date_(value) {\n  return value instanceof Date ? Utilities.formatDate(value,'Asia/Vientiane','yyyy-MM-dd') : String(value);\n}\nfunction accounts_(sheet) {\n  return rows_(sheet,'Accounts',5).filter(r=>r[0] !== '').map(r=>({code:String(r[0]), name:String(r[1]),type:String(r[2]),parent:String(r[3]),use:String(r[4])}));\n}\nfunction state() {\n  const {sheet,email,owner} = context_();\n  const entries=rows_(sheet,'Journal',12).filter(r=>r[0]).map(r=>({id:String(r[0]),date:date_(r[1]),book:String(r[2]),memo:String(r[3]),code:String(r[4]),name:String(r[5]),type:String(r[6]),debit:Number(r[7]||0),credit:Number(r[8]||0),by:String(r[9])}));\n  return {title:sheet.getSheetByName('Settings').getRange('B2').getDisplayValue(), url:sheet.getUrl(),email,owner:email===owner,accounts:accounts_(sheet),entries,today:date_(new Date())};\n}\nfunction lock_(action) {\n  const lock=LockService.getScriptLock(); lock.waitLock(15000);\n  try { const result=action(); SpreadsheetApp.flush(); return result; } finally { lock.releaseLock(); }\n}\nfunction text_(s,limit) {\n  s=String(s||'').trim();\n  if(!s || s.length>limit || /^[=+@\\-]/.test(s)) throw Error('Enter plain text up to '+limit+' characters.');\n  return s;\n}\nfunction cents_(n) {\n  if(n==='' || n==null) return 0;\n  if(!/^(0|[1-9]\\d{0,10})(\\.\\d{1,2})?$/.test(String(n))) throw Error('Use a nonnegative amount with at most two decimals.');\n  return Math.round(Number(n)*100);\n}\nfunction saveAccount(input) {\n  return lock_(()=>{\n    const {sheet}=context_(), accounts=accounts_(sheet);\n    const code=String(input.code||'').trim(), name=text_(input.name,80),parent=String(input.parent||'');\n    if(!/^[1-9]\\d{1,9}$/.test(code)||accounts.some(a=>a.code===code)) throw Error('Use a new numeric code (2–10 digits).');\n    if(!TYPES.includes(input.type)||!['Group','Posting'].includes(input.use)) throw Error('Choose a valid classification and use.');\n    if(parent && !accounts.some(a=>a.code===parent&&a.type===input.type&&a.use==='Group')) throw Error('Choose a parent group of the same classification.');\n    sheet.getSheetByName('Accounts').appendRow([code,name,input.type,parent,input.use]);\n    return code;\n  });\n}\nfunction renameLedger(name) {\n  return lock_(()=>{\n    const {sheet,email,owner}=context_(); if(email!==owner) throw Error('Only the owner can change the app name.');\n    const title=text_(name,60); sheet.getSheetByName('Settings').getRange('B2').setValue(title); sheet.getSheetByName('Overview').getRange('A1').setValue(title); return title;\n  });\n}\nfunction postEntry(input) {\n  return lock_(()=>{\n    const {sheet,email}=context_(), journal=sheet.getSheetByName('Journal');\n    const token=String(input.key||'');\n    if(!/^[a-f0-9-]{36}$/i.test(token)) throw Error('Missing posting reference.');\n    const existing=journal.getLastRow()>1 && journal.getRange(2,12,journal.getLastRow()-1,1).createTextFinder(token).matchEntireCell(true).findNext();\n    if(existing) {\n      const row=journal.getRange(existing.getRow(),1,1,10).getValues()[0];\n      if(String(row[9]).toLowerCase()!==email) throw Error('Posting reference already used.');\n      return String(row[0]);\n    }\n    if(!BOOKS.includes(input.book)) throw Error('Choose Personal or Business.');\n    const date=String(input.date||'');\n    if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(date)||!Number.isFinite(Date.parse(date))||new Date(date).toISOString().slice(0,10)!==date) throw Error('Choose a valid date.');\n    const memo=text_(input.memo,180);\n    if(!Array.isArray(input.lines)||input.lines.length\u003c2||input.lines.length>40) throw Error('Use 2–40 journal lines.');\n    const accounts=new Map(accounts_(sheet).filter(a=>a.use==='Posting').map(a=>[a.code,a]));\n    let debits=0,credits=0;const used=new Set();\n    const id='J-'+Utilities.getUuid(),stamp=new Date().toISOString();\n    const data=input.lines.map(line=>{\n      const a=accounts.get(String(line.code)),dr=cents_(line.debit),cr=cents_(line.credit);\n      if(!a||((dr>0)===(cr>0))) throw Error('Each line needs a posting account and one debit or credit.');\n      used.add(a.code);debits+=dr;credits+=cr;\n      return [id,date,input.book,memo,a.code,a.name,a.type,dr/100,cr/100,email,stamp,token];\n    });\n    if(used.size\u003c2||debits!==credits) throw Error('Use at least two different accounts and balance debits and credits.');\n    journal.getRange(journal.getLastRow()+1,1,data.length,12).setValues(data);\n    return id;\n  });\n}\n\nconst LEDGER_HTML_ = \"\u003c!doctype html>\u003chtml lang=\\\"en\\\">\u003chead>\u003cmeta charset=\\\"utf-8\\\">\u003cmeta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\">\u003ctitle>Shared ledger\u003c/title>\u003cstyle>\\n:root{color-scheme:dark;--bg:#0c1022;--panel:#141c34;--text:#eff4ff;--muted:#b2c2da;--line:#344462;--cyan:#70e8fa;--rose:#f399e5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 91% 0%,#233d68 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.42 system-ui,sans-serif;min-height:100vh}main{max-width:680px;margin:auto;padding:22px 16px 48px}header,.row,.actions{display:flex;align-items:center;justify-content:space-between;gap:9px}header{padding-bottom:16px;border-bottom:1px solid var(--cyan)}h1{font-size:clamp(20px,5vw,29px);margin:0;overflow-wrap:anywhere}h2{font-size:19px;margin:16px 0 10px}h3{font-size:16px}button,.link,select,input{border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;padding:9px 12px;min-height:44px}button,.link{cursor:pointer;text-decoration:none}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan)}.gear{font-size:19px;padding:6px 10px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:17px 0}.tiles button{text-align:left;font-weight:650;min-height:47px;border:1px solid transparent;background:linear-gradient(110deg,#251b37,#101f3a) padding-box,linear-gradient(110deg,#dc81d6,#68d5f6) border-box}.tiles i{font-style:normal;color:var(--cyan);display:inline-block;width:25px}.panel{background:#141b30;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.kpi{font-size:25px;font-variant-numeric:tabular-nums;font-weight:650}.sub,.muted,small{color:var(--muted);font-size:13px}.money{white-space:nowrap;font-variant-numeric:tabular-nums}.item{padding:10px 0;border-bottom:1px solid #33405a;display:block;width:100%;text-align:left;background:none;border-radius:0;border-left:0;border-right:0;border-top:0}.item:last-child{border-bottom:0}.item strong{overflow-wrap:anywhere}dialog{width:min(95vw,560px);max-height:90dvh;overflow:auto;border:1px solid #84dff1;background:#10182d;color:var(--text);border-radius:18px;padding:18px;box-shadow:0 12px 80px #050912}dialog::backdrop{background:#030610bd}dialog h2{margin:0}.body{margin:13px 0}.line{border-top:1px solid var(--line);padding:10px 0}label{display:block;font-size:13px;color:var(--muted);margin:8px 0}label select,label input{margin-top:3px;width:100%;color:var(--text);font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{justify-content:flex-end;flex-wrap:wrap;margin-top:14px}.primary{background:#a9edff;color:#071824;font-weight:650}.notice{color:#ffc7a2;white-space:pre-wrap;overflow-wrap:anywhere}.status{min-height:18px;font-size:13px;color:var(--muted)}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}.link{display:inline-flex;align-items:center}.wrap{flex-wrap:wrap}dialog button[aria-label=Close]{min-width:44px} [hidden]{display:none!important}\\n\\nbody{background:radial-gradient(ellipse at 90% 0%,#1c2148 0%,transparent 45%),#0a1021}\\nmain{padding-top:12px}header.hero{min-height:91px;position:relative;isolation:isolate;overflow:hidden;padding:13px 7px 16px 0;border:0;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,#ef74cd,#826af9,#68e1f3) 1}\\n.hero h1{max-width:68%;letter-spacing:-.037em;line-height:1.12;text-wrap:balance;font-size:clamp(21px,5vw,31px)}\\n.orb{position:absolute;right:32px;top:-20px;width:124px;height:124px;border-radius:50%;opacity:.65;z-index:-1;background:radial-gradient(circle,#80dcff 1px,transparent 1.6px) 0 0/5px 5px,radial-gradient(at 35% 30%,#7b3385,#234c80 50%,transparent 72%);mask-image:radial-gradient(circle at 56% 42%,#000 18%,#0008 48%,transparent 72%);transform:rotate(-20deg)}\\n.hero .gear{background:#111b32c9}.tiles{margin:14px 0 16px}.tiles button{display:flex;align-items:center;gap:8px;font-size:15px}.tiles i{display:grid;place-items:center;width:22px}.tiles svg{width:19px;height:19px;fill:none;stroke:#b4e9ff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\\n.panel{background:linear-gradient(110deg,#1c203c,#131e36);border-top-color:#927acc}.kpi{font-size:30px}.status{margin-top:8px;color:#c3b6f2}.item{border-color:#273552}button{touch-action:manipulation}button:active{filter:brightness(1.22)}h2{letter-spacing:-.02em}\\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cheader class=\\\"hero\\\">\u003cdiv class=\\\"orb\\\" aria-hidden=\\\"true\\\">\u003c/div>\u003ch1 id=\\\"title\\\">Shared ledger\u003c/h1>\u003cbutton class=\\\"gear\\\" aria-label=\\\"Settings\\\" onclick=\\\"settings()\\\">⚙\u003c/button>\u003c/header>\u003cnav class=\\\"tiles\\\">\u003cbutton onclick=\\\"journals()\\\">\u003ci aria-hidden=\\\"true\\\">\u003csvg viewBox=\\\"0 0 24 24\\\">\u003cpath d=\\\"M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2zM8 4v16m3-11h5m-5 4h4\\\"/>\u003c/svg>\u003c/i>Journal\u003c/button>\u003cbutton onclick=\\\"accountsView()\\\">\u003ci aria-hidden=\\\"true\\\">\u003csvg viewBox=\\\"0 0 24 24\\\">\u003crect x=\\\"8\\\" y=\\\"2.5\\\" width=\\\"8\\\" height=\\\"5\\\" rx=\\\"1\\\"/>\u003cpath d=\\\"M12 8v4M5 15v-3h14v3\\\"/>\u003crect x=\\\"2\\\" y=\\\"15\\\" width=\\\"6\\\" height=\\\"5\\\" rx=\\\"1\\\"/>\u003crect x=\\\"16\\\" y=\\\"15\\\" width=\\\"6\\\" height=\\\"5\\\" rx=\\\"1\\\"/>\u003c/svg>\u003c/i>Accounts\u003c/button>\u003cbutton onclick=\\\"entryForm('Expense')\\\">\u003ci aria-hidden=\\\"true\\\">\u003csvg viewBox=\\\"0 0 24 24\\\">\u003cpath d=\\\"M5 3l2 1.5L9 3l3 1.5L15 3l2 1.5L19 3v18l-3-2-4 2-4-2-3 2zM8 9h8m-8 4h6\\\"/>\u003c/svg>\u003c/i>Expense\u003c/button>\u003cbutton onclick=\\\"reports()\\\">\u003ci aria-hidden=\\\"true\\\">\u003csvg viewBox=\\\"0 0 24 24\\\">\u003cpath d=\\\"M3 20h18M5 17v-4h3v4m3 0V8h3v9m3 0V4h3v13\\\"/>\u003c/svg>\u003c/i>Reports\u003c/button>\u003c/nav>\u003cdiv class=\\\"row\\\">\u003cselect id=\\\"scope\\\" aria-label=\\\"Home book\\\" onchange=\\\"home()\\\">\u003coption>All books\u003c/option>\u003coption>Personal\u003c/option>\u003coption>Business\u003c/option>\u003c/select>\u003cbutton onclick=\\\"load()\\\">Refresh\u003c/button>\u003c/div>\u003cdiv class=\\\"status\\\" id=\\\"status\\\" role=\\\"status\\\">\u003c/div>\u003cdiv id=\\\"homeData\\\">\u003c/div>\u003c/main>\u003cdialog id=\\\"modal\\\">\u003cheader>\u003ch2 id=\\\"heading\\\">\u003c/h2>\u003cbutton aria-label=\\\"Close\\\" onclick=\\\"closeDialog()\\\">×\u003c/button>\u003c/header>\u003csection id=\\\"content\\\" class=\\\"body\\\">\u003c/section>\u003cdiv class=\\\"notice\\\" id=\\\"err\\\" role=\\\"alert\\\">\u003c/div>\u003c/dialog>\\n\u003cscript>\\n'use strict';\\nconst el=id=>document.getElementById(id);\\nconst esc=value=>String(value??'').replace(/[&\u003c>\\\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\\\"':'&quot;',\\\"'\\\":'&#39;'}[c]));\\nconst amount=n=>'₭'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});\\nconst inSheet = Boolean(window.google && google.script && google.script.run);\\nconst call = inSheet\\n  ? (method,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args))\\n  : previewCall;\\nlet data=null,draft=null,locked=false;\\nfunction ready(){if(data)return true;el('status').textContent='Load the ledger before opening a section.';return false}\\nasync function load(){el('status').textContent=inSheet?'Reading Google Sheet…':'Loading sample entries…';try{data=await call('state');el('title').textContent=data.title;document.title=data.title;el('status').textContent=inSheet?'Saved books · Google Sheets':'Preview · Sample data only';home()}catch(e){el('status').textContent='Could not read the ledger. '+e.message}}\\nfunction dialog(title,html){el('heading').textContent=title;el('content').innerHTML=html;el('err').textContent='';if(!el('modal').open)el('modal').showModal();el('modal').scrollTop=0}\\nfunction closeDialog(){if(!locked)el('modal').close()}\\nel('modal').addEventListener('cancel',event=>{if(locked)event.preventDefault()});\\nfunction guard(f){try{f()}catch(e){el('err').textContent=e.message}}\\nfunction options(values,current){return values.map(v=>'\u003coption '+(v===current?'selected':'')+'>'+esc(v)+'\u003c/option>').join('')}\\nfunction field(name,html){return '\u003clabel>'+name+html+'\u003c/label>'}\\nfunction btn(label,fn,primary=false){return '\u003cbutton class=\\\"'+(primary?'primary':'')+'\\\" onclick=\\\"'+fn+'\\\">'+label+'\u003c/button>'}\\nfunction groupEntries(rows){const groups=new Map();rows.forEach(r=>{if(!groups.has(r.id))groups.set(r.id,[]);groups.get(r.id).push(r)});return [...groups.values()].reverse()}\\nfunction filtered(){const book=el('scope').value;return data.entries.filter(r=>book==='All books'||r.book===book)}\\nfunction entryList(groups){return groups.map(g=>{const r=g[0],index=data.entries.indexOf(r);return '\u003cbutton class=\\\"item\\\" onclick=\\\"detail('+index+')\\\">\u003cspan class=\\\"row\\\">\u003cstrong>'+esc(r.memo)+'\u003c/strong>\u003cb class=\\\"money\\\">'+amount(g.reduce((a,l)=>a+l.debit,0))+'\u003c/b>\u003c/span>\u003csmall>'+esc(r.date)+' · '+esc(r.book)+'\u003c/small>\u003c/button>'}).join('')||'\u003cp class=\\\"muted\\\">No entries yet.\u003c/p>'}\\nfunction net(rows,type){return rows.filter(r=>r.type===type).reduce((s,r)=>s+Math.round(r.debit*100)-Math.round(r.credit*100),0)/100}\\nfunction home(){if(!data)return;let rows=filtered();el('homeData').innerHTML='\u003csection class=\\\"panel\\\">\u003csmall>Net income · All dates\u003c/small>\u003cdiv class=\\\"kpi\\\">'+amount(-net(rows,'Income')-net(rows,'Expense'))+'\u003c/div>\u003c/section>\u003ch2>Recent entries\u003c/h2>'+entryList(groupEntries(rows).slice(0,5))}\\nfunction detail(index){const row=data.entries[index],lines=data.entries.filter(r=>r.id===row.id);dialog('Journal entry','\u003cb>'+esc(row.memo)+'\u003c/b>\u003cp class=\\\"sub\\\">'+esc(row.book)+' · '+esc(row.date)+'\u003c/p>'+ledgerTable(lines)+'\u003cp class=\\\"sub\\\">Posted by '+esc(row.by)+'\u003c/p>')}\\nfunction ledgerTable(lines){return '\u003cdiv class=\\\"table\\\">\u003ctable>\u003ctr>\u003cth>Account\u003c/th>\u003cth>Debit\u003c/th>\u003cth>Credit\u003c/th>\u003c/tr>'+lines.map(l=>'\u003ctr>\u003ctd>'+esc(l.name)+'\u003c/td>\u003ctd>'+(+l.debit?amount(l.debit):'—')+'\u003c/td>\u003ctd>'+(+l.credit?amount(l.credit):'—')+'\u003c/td>\u003c/tr>').join('')+'\u003c/table>\u003c/div>'}\\nfunction journals(){if(!ready())return;dialog('Journal','\u003cdiv class=\\\"actions\\\">'+btn('New entry',\\\"entryForm(\\\\'Journal\\\\')\\\",true)+'\u003c/div>'+entryList(groupEntries(filtered())))}\\nfunction accountsView(){if(!ready())return;dialog('Chart of accounts',btn('Add account','newAccount()',true)+data.accounts.map((a,i)=>'\u003cbutton class=\\\"item\\\" onclick=\\\"accountDetail('+i+')\\\">\u003cstrong>'+esc(a.code)+' · '+esc(a.name)+'\u003c/strong>\u003cbr>\u003csmall>'+esc(a.type)+' · '+esc(a.use)+(a.parent?' · Parent '+esc(a.parent):'')+'\u003c/small>\u003c/button>').join(''))}\\nfunction accountDetail(i){let a=data.accounts[i];let codes=new Set([a.code]);for(let j=0;j\u003cdata.accounts.length;j++){let n=codes.size;data.accounts.forEach(v=>{if(codes.has(v.parent))codes.add(v.code)});if(n===codes.size)break}dialog(a.name,entryList(groupEntries(filtered().filter(r=>codes.has(r.code)))))}\\nfunction acOptions(list,current){return list.map(a=>'\u003coption value=\\\"'+esc(a.code)+'\\\" '+(a.code===current?'selected':'')+'>'+esc(a.code)+' · '+esc(a.name)+'\u003c/option>').join('')}\\nfunction newAccount(){dialog('Add account',field('Code','\u003cinput id=\\\"code\\\" inputmode=\\\"numeric\\\">')+field('Name','\u003cinput id=\\\"accountName\\\" maxlength=\\\"80\\\">')+field('Classification','\u003cselect id=\\\"classify\\\" onchange=\\\"parents()\\\">'+options(['Asset','Liability','Equity','Income','Expense'])+'\u003c/select>')+field('Parent account','\u003cselect id=\\\"parent\\\">\u003c/select>')+field('Use','\u003cselect id=\\\"use\\\">'+options(['Posting','Group'])+'\u003c/select>')+btn('Save account','addAccount()',true));parents()}\\nfunction parents(){el('parent').innerHTML='\u003coption value=\\\"\\\">No parent\u003c/option>'+acOptions(data.accounts.filter(a=>a.use==='Group'&&a.type===el('classify').value))}\\nasync function write(method,args,after){if(locked)return;locked=true;el('err').textContent='Saving…';try{await call(method,...args)}catch(e){el('err').textContent=e.message;locked=false;return}locked=false;el('modal').close();await load();if(after)after()}\\nfunction addAccount(){write('saveAccount',[{code:el('code').value,name:el('accountName').value,type:el('classify').value,parent:el('parent').value,use:el('use').value}],accountsView)}\\nfunction entryForm(mode,keep=false){if(!ready())return;if(!keep){draft={mode,key:crypto.randomUUID(),book:el('scope').value==='Business'?'Business':'Personal',date:data.today,memo:'',lines:[{code:mode==='Expense'?'5100':'1100',debit:'',credit:''},{code:mode==='Expense'?'1100':'4100',debit:'',credit:''}]}}dialog(mode==='Expense'?'Record expense':'New journal entry','\u003cdiv class=\\\"two\\\">'+field('Book','\u003cselect id=\\\"book\\\">'+options(['Personal','Business'],draft.book)+'\u003c/select>')+field('Date','\u003cinput type=\\\"date\\\" id=\\\"date\\\" value=\\\"'+esc(draft.date)+'\\\">')+'\u003c/div>'+field('Description','\u003cinput id=\\\"memo\\\" maxlength=\\\"180\\\" value=\\\"'+esc(draft.memo)+'\\\">')+'\u003cdiv id=\\\"lines\\\">\u003c/div>\u003cdiv class=\\\"actions\\\">'+(mode==='Journal'?btn('Add line','addLine()'):'')+btn('Review','guard(review)',true)+'\u003c/div>');drawLines()}\\nfunction drawLines(){const list=data.accounts.filter(a=>a.use==='Posting');if(draft.mode==='Expense'){el('lines').innerHTML=field('Expense account','\u003cselect id=\\\"ac0\\\">'+acOptions(list.filter(a=>a.type==='Expense'),draft.lines[0].code)+'\u003c/select>')+field('Paid from','\u003cselect id=\\\"ac1\\\">'+acOptions(list.filter(a=>a.type==='Asset'||a.type==='Liability'),draft.lines[1].code)+'\u003c/select>')+field('Amount (LAK)','\u003cinput inputmode=\\\"decimal\\\" id=\\\"expAmount\\\" value=\\\"'+esc(draft.lines[0].debit)+'\\\">');return}\\nel('lines').innerHTML=draft.lines.map((l,i)=>'\u003cdiv class=\\\"line\\\">'+field('Account','\u003cselect id=\\\"ac'+i+'\\\">'+acOptions(list,l.code)+'\u003c/select>')+'\u003cdiv class=\\\"two\\\">'+field('Debit','\u003cinput inputmode=\\\"decimal\\\" id=\\\"dr'+i+'\\\" value=\\\"'+esc(l.debit)+'\\\">')+field('Credit','\u003cinput inputmode=\\\"decima
