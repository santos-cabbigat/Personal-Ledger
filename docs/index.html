<script src="demo.js?v=20261111-books-2"></script><script>
'use strict';
const el=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=n=>'₭'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const inSheet = Boolean(window.google && google.script && google.script.run);
const call = inSheet
  ? (method,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args))
  : previewCall;
let data=null,draft=null,locked=false;
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && data && !locked && !el('modal').open)load();
});
function ready(){if(data)return true;el('status').textContent='Connect Google Drive or open your ledger to continue.';return false}
let loadVersion=0;
async function load(initial){
  const version=++loadVersion;
  el('status').textContent=inSheet?'Reading Google Sheet…':'Loading sample entries…';
  try{
    const next=initial || await call('state');
    if(next.loadError)throw Error(next.loadError);
    if(version!==loadVersion)return;
    if(next.connected===false){
      data=null;
      el('title').textContent='Personal & Business Ledger';
      el('status').textContent='Signed in as '+next.email;
      el('homeData').innerHTML='<div class="panel"><h2>Your ledger</h2>'+connectButtons()+'</div>';
      return;
    }
    const selected=el('scope').value;
    data=next;
    const books=[...new Set([...data.books,...data.entries.map(row=>row.book)])];
    el('scope').innerHTML='<option value="">All books</option>'+options(books,selected);
    el('title').textContent=data.title;
    document.title=data.title;
    el('status').textContent=inSheet?'Saved books · Google Sheets':'Preview · Sample data only';
    home();
  }catch(e){if(version!==loadVersion)return;if(!data)el('homeData').replaceChildren();el('status').textContent=(data?'Refresh failed. Showing the last loaded entries. ':'Could not read the ledger. ')+e.message;}
}
function connectButtons(){
  return btn('Connect Google Drive','connectDrive()',true)+btn('Open existing ledger','existingLedgerForm()');
}
function connectDrive(){dialog('Connect Google Drive','<p>Open your own ledger, or create an empty one in My Drive → Personal &amp; Business Ledger.</p>'+btn('Connect',"write('connectPersonalDrive',[])",true));}
function existingLedgerForm(){dialog('Open existing ledger',field('Link to your ledger spreadsheet','<input id="sheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/…">')+btn('Open',"write('openExistingLedger',[el('sheetUrl').value])",true));}
function dialog(title,html){el('modal').classList.remove('reportClean');el('heading').textContent=title;el('content').innerHTML=html;el('err').textContent='';if(!el('modal').open)el('modal').showModal();el('modal').scrollTop=0}
function closeDialog(){if(!locked)el('modal').close()}
el('modal').addEventListener('cancel',event=>{if(locked)event.preventDefault()});
function guard(f){try{f()}catch(e){el('err').textContent=e.message}}
function options(values,current){return values.map(v=>'<option '+(v===current?'selected':'')+'>'+esc(v)+'</option>').join('')}
function field(name,html){return '<label>'+name+html+'</label>'}
function btn(label,fn,primary=false){return '<button class="'+(primary?'primary':'')+'" onclick="'+fn+'">'+label+'</button>'}
function groupEntries(rows){const groups=new Map();rows.forEach(r=>{const key=r.groupKey||r.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});return [...groups.values()].reverse()}
let projectFilter='',categoryFilter='';
function categories(){return [...new Set(data.entries.map(r=>r.category).filter(Boolean))].sort();}
function projects(){return [...new Set(data.entries.map(r=>r.project).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
function filtered(){const book=el('scope').value;return data.entries.filter(r=>(!book||r.book===book)&&(!projectFilter||r.project===projectFilter)&&(!categoryFilter||r.category===categoryFilter));}
function projectPicker(){
  const names=projects();
  if(!names.includes(projectFilter)) projectFilter='';
  if(!names.length)return '';
  return field('Project','<select id="projectFilter" onchange="projectFilter=this.value;home()"><option value="">All projects</option>'+options(names,projectFilter)+'</select>');
}
function sheetWarnings(){
  if(!data.warnings?.length)return '';
  return '<details class="notice"><summary>Check '+data.warnings.length+' item(s) in the Journal sheet</summary><ul>'+
    data.warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul></details>';
}
function displayDate(value){
  const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value||'');
  if(!match)return value||'';
  const month=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(match[2])-1];
  return month?match[3]+'-'+month+'-'+match[1]:value;
}
function entryList(groups){return groups.map(g=>{const r=g[0],index=data.entries.indexOf(r);return '<button class="item" onclick="detail('+index+')"><span class="row"><strong>'+esc(r.memo)+'</strong><b class="money">'+amount(g.reduce((a,l)=>a+l.debit,0))+'</b></span><small>'+esc(r.sheetDraft?'Ready to post · '+r.id:r.id)+' · '+esc(displayDate(r.date))+' · '+esc(r.book)+(r.project?' · '+esc(r.project):'')+'</small></button>'}).join('')||'<p class="muted">No entries yet.</p>'}
function net(rows,type){return rows.filter(r=>r.type===type).reduce((s,r)=>s+Math.round(r.debit*100)-Math.round(r.credit*100),0)/100}
function home(){if(!data)return;const names=categories();if(!names.includes(categoryFilter))categoryFilter='';const picker=projectPicker()+(names.length?field('Category','<select id="categoryFilter" onchange="categoryFilter=this.value;home()"><option value="">All categories</option>'+options(names,categoryFilter)+'</select>'):'');let rows=filtered();el('homeData').innerHTML=picker+sheetWarnings()+'<section class="panel"><small>Net income · All dates</small><div class="kpi">'+amount(-net(rows,'Income')-net(rows,'Expense'))+'</div></section><h2>Recent entries</h2>'+entryList(groupEntries(rows).slice(0,5))}
function detail(index){
  const row=data.entries[index],lines=data.entries.filter(r=>(r.groupKey||r.id)===(row.groupKey||row.id));
  dialog('Journal entry','<b>'+esc(row.memo)+'</b><p class="sub">'+esc([row.book,row.project,row.category,displayDate(row.date)].filter(Boolean).join(' · '))+'</p>'+
    ledgerTable(lines)+'<p class="sub">'+esc(row.by?'Posted by '+row.by:'Entered in Google Sheets')+'<br>'+esc(row.id)+'</p>'+btn(row.sheetDraft?'Review & post sheet entry':'Edit entry','editEntry('+index+')',true));
}
function editEntry(index){
  const row=data.entries[index];
  const entryLines=data.entries.filter(r=>(r.groupKey||r.id)===(row.groupKey||row.id));
  const commonReference=entryLines.every(r=>r.reference===row.reference) ? row.reference||'' : '';
  draft={mode:'Journal',sourceBook:row.book,reference:commonReference,key:crypto.randomUUID(),ledgerId:data.ledgerId,editId:row.id,revision:row.revision,groupKey:row.groupKey,sheetDraft:row.sheetDraft,
    book:row.book,project:row.project||'',category:row.category||'',date:row.date,memo:row.memo,
    lines:entryLines.map(r=>({code:r.code,reference:commonReference?'':r.reference||'',lineMemo:r.lineMemo && r.lineMemo!==row.memo?r.lineMemo:'',debit:r.debit?String(r.debit):'',credit:r.credit?String(r.credit):''}))};
  entryForm('Journal',true);
}
function ledgerTable(lines){return '<div class="table"><table><tr><th>Account</th><th>Debit</th><th>Credit</th></tr>'+lines.map(l=>'<tr><td>'+esc(l.name)+(l.lineMemo&&l.lineMemo!==l.memo?'<br><small>'+esc(l.lineMemo)+'</small>':'')+(l.reference?'<br><small>Ref. '+esc(l.reference)+'</small>':'')+'</td><td>'+(+l.debit?amount(l.debit):'—')+'</td><td>'+(+l.credit?amount(l.credit):'—')+'</td></tr>').join('')+'</table></div>'}
function idPicker(groups){
  const posted=groups.filter(([row])=>!row.sheetDraft || row.groupKey?.includes('id:'));
  if(!posted.length)return '';
  return field('Find entry ID','<select id="entryIdPicker" onchange="if(this.value)detail(Number(this.value))"><option value="">Choose an entry ID</option>'+
    posted.map(([line])=>'<option value="'+data.entries.indexOf(line)+'">'+esc(line.id)+' · '+esc(line.memo)+'</option>').join('')+'</select>');
}
function journals(){if(!ready())return;const groups=groupEntries(filtered());dialog('Journal','<div class="actions">'+btn('New entry',"entryForm('Journal')",true)+btn('Download journal CSV','downloadJournal()')+'</div>'+idPicker(groups)+entryList(groups))}
function inBook(account,book){return account.book===undefined || account.book===book}
function chartFor(book){return data.accounts.filter(a=>inBook(a,book))}
function accountsView(chosen){
  if(!ready())return;
  const book=chosen||el('scope').value||data.books[0];
  const accounts=chartFor(book);
  dialog('Chart of accounts',field('Book','<select id="chartBook" onchange="accountsView(this.value)">'+options(data.books,book)+'</select>')+
    btn('Add account','newAccount()')+btn('Download accounts CSV','downloadAccounts()')+
    (accounts.map(a=>'<button class="item" onclick="accountDetail('+data.accounts.indexOf(a)+')"><strong>'+esc(a.code)+' · '+esc(a.name)+'</strong><br><small>'+esc([a.type,a.use,a.role,a.parent?'Parent '+a.parent:''].filter(Boolean).join(' · '))+'</small></button>').join('')||'<p>No accounts in this book yet.</p>'));
}
function accountDetail(i){
  const a=data.accounts[i],book=el('chartBook').value,chart=chartFor(book),codes=new Set(a.use==='Posting'?[a.code]:[]);
  if(a.use==='Group'){
    const parents=new Set([a.code]);
    for(let n=0;n<chart.length;n++){const previous=parents.size;for(const child of chart)if(parents.has(child.parent))(child.use==='Group'?parents:codes).add(child.code);if(parents.size===previous)break;}
  }
  dialog(a.name,entryList(groupEntries(data.entries.filter(r=>r.book===book && codes.has(r.code)))));
}
function acOptions(list,current){return list.map(a=>'<option value="'+esc(a.code)+'" '+(a.code===current?'selected':'')+'>'+esc(a.code)+' · '+esc(a.name)+'</option>').join('')}
function newAccount(){
  const book=el('chartBook').value;
  dialog('Add account',field('Book type','<select id="accountBook" onchange="parents()">'+options(data.books,book)+'</select>')+field('Code','<input id="code" inputmode="numeric">')+field('Name','<input id="accountName" maxlength="80">')+field('Classification','<select id="classify" onchange="parents()">'+options(['Asset','Liability','Equity','Income','Expense'])+'</select>')+field('Parent account','<select id="parent"></select>')+field('Use','<select id="use" onchange="parents()">'+options(['Posting','Group'])+'</select>')+field('Cash / bank role','<select id="role"><option value="">None</option>'+options(['Bank','Cash'])+'</select>')+btn('Save account','addAccount()',true));parents();
}
function parents(){el('parent').innerHTML='<option value="">No parent</option>'+acOptions(chartFor(el('accountBook').value).filter(a=>a.type===el('classify').value&&a.use==='Group'));el('role').disabled=el('classify').value!=='Asset'||el('use').value!=='Posting';if(el('role').disabled)el('role').value=''}
async function write(method,args,after){if(locked)return;locked=true;el('err').textContent='Saving…';let result;try{result=await call(method,...args)}catch(e){el('err').textContent=e.message;locked=false;return}locked=false;el('modal').close();await load();if(after&&data)after(result)}
function addAccount(){const book=el('accountBook').value;write('saveAccount',[{ledgerId:data.ledgerId,book,role:el('role').value,code:el('code').value,name:el('accountName').value,type:el('classify').value,parent:el('parent').value,use:el('use').value}],()=>accountsView(book))}
function entryForm(mode,keep=false){if(!ready())return;if(!keep){draft={mode,key:crypto.randomUUID(),ledgerId:data.ledgerId,reference:'',project:projectFilter,category:categoryFilter,book:el('scope').value||data.books[0]||'',date:data.today,memo:'',lines:[{code:mode==='Expense'?'5100':'1100',debit:'',credit:''},{code:mode==='Expense'?'1100':'4100',debit:'',credit:''}]}}dialog(draft.sheetDraft?'Post sheet entry':draft.editId?'Edit journal entry':mode==='Expense'?'Record expense':'New journal entry','<div class="two">'+field('Book','<select id="book" onchange="changeEntryBook()">'+options([...new Set([...data.books,draft.book].filter(Boolean))],draft.book)+'</select>')+field('Date','<input type="date" id="date" value="'+esc(draft.date)+'">')+'</div>'+field('Project (optional)','<input id="project" list="projectNames" maxlength="80" value="'+esc(draft.project)+'" placeholder="Choose or type a project name"><datalist id="projectNames">'+options(projects(),draft.project)+'</datalist>')+field('Category (optional)','<input id="category" list="categoryNames" maxlength="80" value="'+esc(draft.category)+'" placeholder="Choose or type a category"><datalist id="categoryNames">'+options(categories(),draft.category)+'</datalist>')+field('Reference (optional)','<input id="reference" autocapitalize="characters" oninput="upperReference(this)" maxlength="180" value="'+esc(draft.reference)+'" placeholder="Receipt or bank transfer number">')+field('Description','<input id="memo" maxlength="180" value="'+esc(draft.memo)+'">')+'<div id="lines"></div><div class="actions">'+(mode==='Journal'?btn('Add line','addLine()'):'')+btn('Review','guard(review)',true)+'</div>');drawLines()}
function formatAmount(value){
  const parts=String(value??'').replace(/,/g,'').split('.');
  if(parts.length>2 || !/^\d*$/.test(parts[0]) || (parts.length===2 && !/^\d*$/.test(parts[1])))return String(value);
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return parts.join('.');
}
function formatTyping(input){
  const before=input.value,caret=input.selectionStart;
  const plainBefore=before.slice(0,caret).replace(/,/g,'').length;
  const after=formatAmount(before);
  if(after===before)return;
  input.value=after;
  let cursor=0,seen=0;
  while(cursor<after.length && seen<plainBefore){if(after[cursor]!==',')seen++;cursor++;}
  input.setSelectionRange(cursor,cursor);
}
function upperReference(input){
  const original=input.value,upper=original.toUpperCase();
  if(upper===original)return;
  const start=original.slice(0,input.selectionStart).toUpperCase().length;
  const end=original.slice(0,input.selectionEnd).toUpperCase().length;
  input.value=upper;input.setSelectionRange(start,end);
}
function amountInput(id,value){
  return '<input inputmode="decimal" id="'+id+'" oninput="formatTyping(this)" value="'+esc(formatAmount(value))+'">';
}
function changeEntryBook(){
  const previous=draft.book;readForm();if(previous===draft.book)return;
  draft.lines.forEach(line=>{line.code=''});drawLines();
}
function drawLines(){const list=chartFor(draft.book).filter(a=>a.use==='Posting');if(draft.mode==='Expense'){el('lines').innerHTML=field('Expense account','<select id="ac0">'+acOptions(list.filter(a=>a.type==='Expense'),draft.lines[0].code)+'</select>')+field('Paid from','<select id="ac1">'+acOptions(list.filter(a=>a.type==='Asset'||a.type==='Liability'),draft.lines[1].code)+'</select>')+field('Amount (LAK)',amountInput('expAmount',draft.lines[0].debit));return}
el('lines').innerHTML=draft.lines.map((l,i)=>'<div class="line">'+field('Account','<select id="ac'+i+'">'+acOptions(list,l.code)+'</select>')+'<div class="two">'+field('Debit',amountInput('dr'+i,l.debit))+field('Credit',amountInput('cr'+i,l.credit))+'</div><details '+(l.reference||l.lineMemo?'open':'')+'><summary>Line description or reference</summary>'+field('Line description','<input id="lineMemo'+i+'" maxlength="180" value="'+esc(l.lineMemo)+'">')+field('Line reference','<input id="lineRef'+i+'" autocapitalize="characters" oninput="upperReference(this)" maxlength="180" value="'+esc(l.reference)+'">')+'</details>'+(draft.lines.length>2?btn('Remove','removeLine('+i+')'):'')+'</div>').join('')}
function readForm(){draft.book=el('book').value;draft.date=el('date').value;draft.reference=el('reference').value.trim();draft.memo=el('memo').value.trim();draft.project=el('project').value.trim();draft.category=el('category').value.trim();draft.lines.forEach((l,i)=>{l.code=el('ac'+i).value;if(draft.mode==='Expense'){l.debit=i===0?el('expAmount').value.replace(/,/g,''):'';l.credit=i===1?el('expAmount').value.replace(/,/g,''):''}else{l.lineMemo=el('lineMemo'+i).value.trim();l.reference=el('lineRef'+i).value.trim();l.debit=el('dr'+i).value.replace(/,/g,'').trim();l.credit=el('cr'+i).value.replace(/,/g,'').trim()}})}
function addLine(){readForm();if(draft.lines.length<40){draft.lines.push({code:'',debit:'',credit:''});drawLines()}}
function removeLine(i){readForm();draft.lines.splice(i,1);drawLines()}
function review(){readForm();if(!draft.memo||!draft.date)throw Error('Enter a date and description.');
let dr=0,cr=0;for(const l of draft.lines){for(const n of [l.debit,l.credit])if(n&&!/^(0|[1-9]\d{0,10})(\.\d{1,2})?$/.test(n))throw Error('Enter amounts with up to two decimals.');if((+l.debit>0)===(+l.credit>0))throw Error('Each account needs either a debit or a credit.');dr+=Math.round(l.debit*100);cr+=Math.round(l.credit*100)}
if(dr!==cr||!dr||new Set(draft.lines.map(l=>l.code)).size<2)throw Error('Debits and credits must balance across at least two accounts.');
const lines=draft.lines.map(l=>({...l,reference:l.reference||draft.reference,name:chartFor(draft.book).find(a=>a.code===l.code && a.use==='Posting')?.name||''}));dialog('Review entry','<strong>'+esc(draft.memo)+'</strong><p class="sub">'+esc([draft.book,draft.project,draft.category,displayDate(draft.date)].filter(Boolean).join(' · '))+'</p>'+ledgerTable(lines)+'<p>Balanced · '+amount(dr/100)+'</p><div class="actions">'+btn('Back','entryForm(draft.mode,true)')+btn(draft.editId&&!draft.sheetDraft?'Save changes':'Post entry','post()',true)+'</div>')}
function post(){
  write('postEntry',[draft],id=>{
    draft=null;
    const index=data.entries.findIndex(row=>row.id===id);
    if(index>=0)detail(index);
  });
}
function basisPicker(id,change){return field('Entry status','<select id="'+id+'" onchange="'+change+'">'+options(['All balanced entries','Posted only'])+'</select>')}
function reports(){if(!ready())return;dialog('Reports',btn('Monthly financial report','monthlyReport()',true)+field('Book','<select id="reportBook" onchange="reportData()"><option value="">All books</option>'+options(data.books,el('scope').value)+'</select>')+basisPicker('reportBasis','reportData()')+field('Report','<select id="report" onchange="reportData()">'+options(['Trial balance','Income and expenses','Balance sheet','General ledger'])+'</select>')+'<div class="two">'+field('From','<input type="date" id="from" onchange="reportData()">')+field('Through','<input type="date" id="through" onchange="reportData()">')+'</div><div id="result"></div>'+btn('Download report CSV','downloadReport()'));reportData()}
let reportExport;
function reportData(){
  const kind=el('report').value,from=el('from').value,to=el('through').value,asOf=kind==='Balance sheet';
  el('from').disabled=asOf;
  reportExport=null;
  if(!asOf&&from&&to&&from>to){el('result').textContent='Choose an end date on or after the start date.';return;}
  const chosen=el('reportBook').value;
  const postedOnly=el('reportBasis').value==='Posted only';
  const rows=data.entries.filter(r=>(!postedOnly||!r.sheetDraft) && (!chosen||r.book===chosen) && (!projectFilter||r.project===projectFilter) && (!categoryFilter||r.category===categoryFilter)).filter(r=>(asOf||!from||r.date>=from)&&(!to||r.date<=to));
  let headers,records=[],moneyColumns=[];
  if(kind==='Income and expenses'||asOf){
    headers=['Item','Amount (LAK)'];moneyColumns=[1];
    const inc=-net(rows,'Income'),exp=net(rows,'Expense'),liabilities=-net(rows,'Liability'),equity=-net(rows,'Equity');
    records=asOf?[['Assets',net(rows,'Asset')],['Liabilities',liabilities],['Equity before earnings',equity],['Accumulated earnings',inc-exp],['Total liabilities and equity',liabilities+equity+inc-exp]]:
      [['Income',inc],['Expenses',exp],['Net income',inc-exp]];
  }else if(kind==='General ledger'){
    headers=['Code','Account','Date','Book','Project','Category','Description','Reference','Debit (LAK)','Credit (LAK)','Status'];moneyColumns=[8,9];
    for(const book of data.books.filter(b=>!chosen||b===chosen))
      for(const account of chartFor(book).filter(a=>a.use==='Posting'))
        for(const line of rows.filter(r=>r.book===book&&r.code===account.code).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))){
          records.push([account.code,account.name,displayDate(line.date),book,line.project||'',line.category||'',line.lineMemo||line.memo,line.reference||'',line.debit,line.credit,line.sheetDraft?'Balanced draft':'Posted']);
        }
  }else{
    headers=['Book','Code','Account','Debit (LAK)','Credit (LAK)'];moneyColumns=[3,4];
    for(const book of data.books.filter(b=>!chosen||b===chosen)){
      let drTotal=0,crTotal=0;
      for(const account of chartFor(book).filter(a=>a.use==='Posting')){
        const cents=rows.filter(r=>r.book===book && r.code===account.code).reduce((sum,r)=>sum+Math.round(r.debit*100)-Math.round(r.credit*100),0);
        if(!cents)continue;
        const dr=Math.max(cents,0),cr=Math.max(-cents,0);records.push([book,account.code,account.name,dr/100,cr/100]);drTotal+=dr;crTotal+=cr;
      }
      records.push([book,'','Total',drTotal/100,crTotal/100]);
    }
  }
  const scope=[chosen||'All books',projectFilter||'All projects',categoryFilter||'All categories',asOf?'Beginning':from||'Beginning',to||'All dates',el('reportBasis').value];
  const html='<div class="table"><table><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+
    records.map(row=>'<tr>'+row.map((v,i)=>'<td>'+esc(moneyColumns.includes(i)?amount(v):v)+'</td>').join('')+'</tr>').join('')+'</table></div>';
  el('result').innerHTML='<p class="sub">'+esc(scope.join(' · '))+'</p>'+html;
  reportExport={name:kind,rows:[[kind],['Book','Project','Category','From','Through','Entry status'],scope,[],headers,...records]};
}
function makeReportImage({book,periodLabel,asOf,opening,received,spent,income,expense,openingFunds,groups,postedCount,pending,basis}){
  const width=900,pad=52,inner=width-2*pad;
  const canvas=document.createElement('canvas'),scale=1.5;
  canvas.width=width*scale;canvas.height=1230*scale;
  const ctx=canvas.getContext('2d');ctx.scale(scale,scale);
  const ink='#211f39',muted='#635f77',navy='#191e38',violet='#513b79',teal='#175e57';
  const font=(size,weight=400)=>{ctx.font=weight+' '+size+'px Arial, sans-serif'};
  const text=(value,x,y,size,weight=400,color=ink)=>{font(size,weight);ctx.fillStyle=color;ctx.fillText(String(value),x,y)};
  const fit=(value,x,y,max,size,weight,color)=>{font(size,weight);while(ctx.measureText(value).width>max&&size>14)font(--size,weight);text(value,x,y,size,weight,color)};
  const rect=(x,y,w,h,color)=>{ctx.fillStyle=color;ctx.fillRect(x,y,w,h)};
  const money=n=>amount(n);
  rect(0,0,width,1230,'#ffffff');
  const grad=ctx.createLinearGradient(0,0,width,250);grad.addColorStop(0,navy);grad.addColorStop(1,violet);rect(0,0,width,235,grad);
  text('MONTHLY FINANCIAL UPDATE',pad,54,17,700,'#baf4e9');fit(book,pad,130,inner,58,700,'#ffffff');
  text(periodLabel+(asOf?'   ·   Entries through '+asOf:''),pad,182,23,400,'#eee6ff');
  rect(0,235,width,7,'#8ad9c9');
  let y=288;
  text('Money left in the bank',pad,y,24,600,teal);fit(money(opening+received-spent),pad,y+65,inner,62,700,ink);
  y+=96;rect(pad,y,inner,98,'#e9f6f3');
  const metrics=[['Bank at start',opening],['Money in',received],['Money out',spent]];
  metrics.forEach(([label,n],i)=>{const x=pad+18+i*inner/3;text(label,x,y+34,18,400,muted);fit(money(n),x,y+72,inner/3-32,27,700,ink)});
  y+=145;
  const wrap=(value,size,max)=>{font(size);const lines=[];let line='';for(const word of value.split(' ')){if(line&&ctx.measureText(line+' '+word).width>max){lines.push(line);line=word}else line+=(line?' ':'')+word}if(line)lines.push(line);return lines};
  const summary=openingFunds>0?'Of the money in, '+money(openingFunds)+' was recorded as opening funds.':'The bank started at '+money(opening)+'. Money in less money out gives the balance above.';
  for(const line of wrap(summary,22,inner)){text(line,pad,y,22,400,muted);y+=30}
  y+=24;
  const detail=(title,total,items,empty)=>{
    rect(pad,y-20,6,31,'#a892d3');text(title,pad+18,y+2,26,700,violet);
    y+=44;
    const rows=items.slice().sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
    const visible=rows.length>3?[...rows.slice(0,2),['Other accounts',rows.slice(2).reduce((sum,x)=>sum+x[1],0)]]:rows;
    if(!visible.length){text(empty,pad+4,y,20,400,muted);y+=32;}
    for(const [label,n] of visible){
      const end=money(n);font(22,600);const tw=ctx.measureText(end).width;fit(label,pad+4,y,inner-tw-28,21,400,ink);text(end,width-pad-tw,y,22,600,ink);
      rect(pad,y+12,inner,1,'#e6e1ed');y+=45;
    }
    text('Total',pad+4,y,20,700,ink);font(23,700);const val=money(total);text(val,width-pad-ctx.measureText(val).width,y,23,700,ink);y+=64;
  };
  const sources=[],uses=[];
  for(const g of groups.values()){
    if(g.type==='Income')sources.push([/donat|contrib/i.test(g.name)?'Contributions':g.name,[...g.accounts.values()].reduce((sum,c)=>sum+c,0)/100]);
    else for(const [label,c] of g.accounts)uses.push([label,c/100]);
  }
  detail('Where the income came from',income,sources,'No income recorded for this period.');
  detail('What the money was spent on',expense,uses,'No expenses recorded for this period.');
  rect(pad,y-17,inner,60,'#eee9f8');text('Income less expenses',pad+16,y+21,20,600,violet);
  const result=money(income-expense);font(25,700);text(result,width-pad-16-ctx.measureText(result).width,y+22,25,700,violet);
  y+=82;
  text('Amounts in Lao kip',pad,y,16,500,muted);
  const footer=postedCount+' posted  ·  '+pending+' balanced drafts '+(basis==='Posted only'?'excluded':'included');
  font(16);text(footer,width-pad-ctx.measureText(footer).width,y,16,400,muted);
  const cropped=document.createElement('canvas');cropped.width=canvas.width;cropped.height=Math.ceil((y+34)*scale);
  cropped.getContext('2d').drawImage(canvas,0,0);return cropped.toDataURL('image/png');
}
function monthlyReport(book,month,clean=false,basis){
  basis=basis||el('monthBasis')?.value||el('reportBasis')?.value||'All balanced entries';
  book=book||el('reportBook')?.value||el('scope').value||(data.books.includes('Project 1')?'Project 1':data.books[0]);
  month=month||data.today.slice(0,7);
  const chart=chartFor(book),accountMap=new Map(chart.filter(a=>a.use==='Posting').map(a=>[a.code,a]));
  const groupMap=new Map(chart.filter(a=>a.use==='Group').map(a=>[a.code,a.name]));
  const entries=data.entries.filter(r=>r.book===book),included=entries.filter(r=>basis!=='Posted only'||!r.sheetDraft);
  const period=r=>r.date.slice(0,7)===month,inMonth=included.filter(period);
  const banks=included.filter(r=>accountMap.get(r.code)?.role==='Bank');
  const opening=banks.filter(r=>r.date.slice(0,7)<month).reduce((s,r)=>s+Math.round(r.debit*100)-Math.round(r.credit*100),0)/100;
  const movement=banks.filter(period),sum=(lines,side)=>lines.reduce((s,r)=>s+Math.round(r[side]*100),0)/100;
  const received=sum(movement,'debit'),spent=sum(movement,'credit');
  const income=-net(inMonth,'Income'),expense=net(inMonth,'Expense'),groups=new Map();
  for(const r of inMonth){
    if(!['Income','Expense'].includes(r.type))continue;
    const parent=groupMap.get(accountMap.get(r.code)?.parent)||r.type;
    const key=r.type+'|'+parent, group=groups.get(key)||{type:r.type,name:parent,accounts:new Map()};groups.set(key,group);
    const delta=(Math.round(r.debit*100)-Math.round(r.credit*100))*(r.type==='Income'?-1:1);
    group.accounts.set(r.name,(group.accounts.get(r.name)||0)+delta);
  }
  const metric=(label,value)=>'<div><small>'+esc(label)+'</small><b>'+esc(amount(value))+'</b></div>';
  const periodLabel=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(month+'-01T00:00:00Z'));
  const postedCount=new Set(inMonth.filter(r=>!r.sheetDraft).map(r=>r.id)).size,pending=new Set(entries.filter(r=>r.sheetDraft&&period(r)).map(r=>r.id)).size;
  const latest=inMonth.reduce((max,r)=>r.date>max?r.date:max,'');
  const openingFunds=groupEntries(inMonth).reduce((total,lines)=>{
    const bankLines=lines.filter(l=>accountMap.get(l.code)?.role==='Bank');
    const other=lines.filter(l=>accountMap.get(l.code)?.role!=='Bank');
    if(!bankLines.length||!other.length||!other.every(l=>l.type==='Equity'&&/opening balance|beginning balance/i.test(l.name)))return total;
    return total+Math.max(0,sum(bankLines,'debit')-sum(bankLines,'credit'));
  },0);
  const details=[...groups.values()].sort((a,b)=>b.type.localeCompare(a.type)||a.name.localeCompare(b.name)).map(g=>'<h4>'+esc(g.name)+'</h4>'+[...g.accounts].sort((a,b)=>a[0].localeCompare(b[0])).map(([name,c])=>'<div class="rline"><span>'+esc(name)+'</span><b>'+esc(amount(c/100))+'</b></div>').join('')).join('');
  const command='monthlyReport(el(\'monthBook\').value,el(\'monthPeriod\').value';
  const controls='<div class="monthControls two" '+(clean?'hidden':'')+'>'+field('Book','<select id="monthBook" onchange="'+command+')">'+options(data.books,book)+'</select>')+field('Month','<input id="monthPeriod" type="month" value="'+esc(month)+'" onchange="if(this.value)'+command+')">')+field('Entry status','<select id="monthBasis" onchange="'+command+')">'+options(['All balanced entries','Posted only'],basis)+'</select>')+'</div>';
  const sheet='<article class="statement"><div class="statementHead"><small>MONTHLY FINANCIAL REPORT</small><h2>'+esc(book)+'</h2><p>'+esc(periodLabel)+' · Lao kip</p></div>'+
    '<section><h3>Bank movement</h3><div class="closing"><span>Money left in the bank</span><strong>'+esc(amount(opening+received-spent))+'</strong></div><div class="metrics">'+metric('Opening balance',opening)+metric('Money in',received)+metric('Money out',spent)+'</div></section>'+
    '<section><h3>Income &amp; expenses</h3><div class="metrics">'+metric('Income',income)+metric('Expenses',expense)+metric('Income less expenses',income-expense)+'</div></section>'+
    '<section><h3>Account breakdown</h3>'+(details||'<p>No income or expenses for this selection.</p>')+'</section>'+
    '<footer>Posted entries: '+postedCount+(pending?' · '+(basis==='Posted only'?'Balanced drafts excluded: ':'Balanced drafts included: ')+pending:'')+'</footer></article>';
  if(clean){
    const image=makeReportImage({book,periodLabel,asOf:displayDate(latest),opening,received,spent,income,expense,openingFunds,groups,postedCount,pending,basis});
    const file=(book+'-'+month+'-financial-update.png').replace(/[^a-z0-9._-]/gi,'-');
    const actions='<div class="actions"><a class="link" download="'+esc(file)+'" href="'+image+'">Save report image</a>'+btn('Show controls',command+',false)')+'</div>';
    dialog('Monthly report',controls+'<img class="statementImage" src="'+image+'" alt="Monthly financial update for '+esc(book)+'. Money left in the bank: '+esc(amount(opening+received-spent))+'">'+actions);
  }else dialog('Monthly report',controls+sheet+'<div class="actions">'+btn('Screenshot view',command+',true)',true)+'</div>');
  el('modal').classList.toggle('reportClean',clean);
}
function csv(name,rows){
  const escapeCell=value=>{
    let s=String(value??'');
    if(typeof value==='string'&&/^[\s]*[=+@-]/.test(s)) s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(escapeCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name+'.csv';
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),60000);
}
