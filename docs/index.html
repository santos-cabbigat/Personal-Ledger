'use strict';
const el=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=n=>'₭'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const inSheet = Boolean(window.google && google.script && google.script.run);
const preview = !inSheet && new URLSearchParams(location.search).get('preview')==='1';
const pages = !inSheet && !preview;
const call = inSheet
  ? (method,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args))
  : preview ? previewCall : ledgerDb.call;
let data=null,draft=null,locked=false,lastReadAt=0;
let refreshInProgress=false;
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && data && !locked && !refreshInProgress &&
    ((pages && !data.owner) || (!el('modal').open && Date.now()-lastReadAt>=60000)))load();
});
function ready(){return Boolean(data)}
let loadVersion=0, currentView='Overview';
function setView(name) {
  currentView=name;
  el('viewTitle').textContent=name;
  el('homeData').hidden=name!=='Overview';
  el('work').hidden=name==='Overview';
  for (const button of document.querySelectorAll('.navRail button')) {
    if(button.dataset.view===name) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  }
  renderViewActions();
}
function actionIcon(label,command,path,primary=false){return '<button type="button" class="iconButton toolIcon'+(primary?' primary':'')+'" title="'+esc(label)+'" aria-label="'+esc(label)+'" onclick="'+command+'"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="'+path+'"/></svg></button>';}
function renderViewActions(){
  const host=el('viewActions');if(!host)return;
  let add='';
  if(data&&currentView==='Journal'&&(el('scope').value?canEdit(el('scope').value):editableBooks().length))add=actionIcon('New entry','entryForm()','M12 5v14M5 12h14',true);
  if(data&&currentView==='Accounts'&&canEdit(el('scope').value||data.books[0]))add=actionIcon('Add account','newAccount()','M12 5v14M5 12h14',true);
  host.innerHTML=add+(data&&['Journal','Accounts','Expense','Reports'].includes(currentView)?actionIcon('Download '+(currentView==='Reports'?(el('report')?.value||'Trial balance'):currentView.toLowerCase()),'openDownload()','M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5'):'');
}
function overview(){setView('Overview'); if(data) home()}
function workspace(name,html) {
  if(el('modal').open) closeDialog();
  setView(name);
  el('work').innerHTML=html;
}
function changeScope() {
  if(el('modal').open)return;
  if(currentView==='Journal')journals();
  else if(currentView==='Expense')expenses();
  else if(currentView==='Accounts')accountsView();
  else if(currentView==='Reports')reports();
  else home();
}
function accessScreen(title,message='',actions=''){
  el('dashboard').hidden=true;
  el('ledgerNav').inert=false;
  el('settingsButton').hidden=true;
  el('access').hidden=false;
  el('accessTitle').textContent=title;
  el('accessMessage').textContent=message;
  el('accessActions').innerHTML=actions;
}
function resetLedger(){
  pendingAccessEmail=null;if(typeof LedgerAccessEmail!=='undefined')LedgerAccessEmail.clear();
  data=null;draft=null;reportExport=null;monthlyExport=null;downloadExport=null;expenseMonth='';reportFilters={kind:'Trial balance',from:'',to:'',basis:'All balanced entries',assetKeys:[]};
  if(el('modal').open)el('modal').close();
  for(const id of ['homeData','work','content','err','status'])el(id).textContent='';
  el('scope').innerHTML='<option value="">All books</option>';
  document.title=el('title').textContent='Personal & Business Ledger';
  setView('Overview');
}
function recoveryLink(error){
  if(!/paused|unavailable|failed to fetch|network|offline|temporar/i.test(error.message))return '';
  return btn('Check service status','openServiceStatus()');
}
async function openServiceStatus(fromSettings=false){
  const show=fromSettings?(title,html)=>settingsDialog(title,html,settings):dialog;
  show('Service status','<p id="serviceResult" role="status">Checking the sign-in service…</p><div class="actions">'+
    btn('Check again','openServiceStatus('+fromSettings+')')+'<a class="link" href="https://supabase.com/dashboard/project/uyyihuvjbrbsombzzvqw" target="_blank" rel="noopener">Open personal Supabase project</a></div>');
  const output=el('serviceResult');
  const state=await ledgerDb.serviceStatus();
  const messages={
    online:'Online. The personal ledger sign-in service is responding.',
    paused:'Your database is paused. Open your personal Supabase project, choose Resume project, then return here and check again.',
    unavailable:'The sign-in service is unavailable. The owner can check the project in Supabase.',
    unreachable:'This device could not reach the sign-in service. Check your connection and try again.'
  };
  output.textContent=messages[state];
}
let loginMode='login';
function loginScreen(message='',mode='login'){
  mode=['forgot','reset'].includes(mode)?mode:'login';loginMode=mode;
  const reset=mode==='reset',forgot=mode==='forgot';
  const title=reset?'New password':forgot?'Reset password':'Sign in';
  const email=reset?'':field('Email','<input id="loginEmail" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="Email address" required>');
  const pass=forgot?'':field('Password',passwordInput('loginPassword','autocomplete="'+(reset?'new-password':'current-password')+'" placeholder="Password" required'));
  const help=forgot?'Enter your email to receive a reset link.':reset?'Choose a new password.':'';
  accessScreen(title,message||help,'<form onsubmit="event.preventDefault();submitLogin()">'+email+pass+'<button class="primary" type="submit">'+(reset?'Save password':forgot?'Send reset link':'Sign in')+'</button></form>'+
    '<div class="loginLinks">'+(mode==='login'?btn('Forgot password?',"loginScreen('', 'forgot')"):btn('Back to sign in','loginScreen()'))+'</div>');
  document.body.classList.add('loginPage');
}
async function submitLogin(){
  const email=el('loginEmail')?.value.trim(),password=el('loginPassword')?.value,mode=loginMode;
  const button=el('accessActions').querySelector('button[type=submit]');
  button.disabled=true;el('accessMessage').textContent='Please wait…';
  try{
    if(mode==='forgot'){await ledgerDb.forgot(email);loginScreen('Check your inbox for a password reset link.');return;}
    if(mode==='reset'){await ledgerDb.password(password);history.replaceState(null,'',location.pathname);}
    else await ledgerDb.signIn(email,password);
    await load();
  }catch(e){el('accessMessage').textContent=e.message;}finally{button.disabled=false;}
}
async function signOut(){++loadVersion;try{await ledgerDb.signOut();}finally{resetLedger();loginScreen();}}
async function reconnect(){resetLedger();loginScreen();}
async function load(initial,fresh=false){
  const version=++loadVersion;
  refreshInProgress=true;
  if(data)el('status').textContent='Refreshing…';
  try{
    if(pages){
      const session=await ledgerDb.session();if(version!==loadVersion)return;
      if(!session){resetLedger();loginScreen();return;}
      if(new URLSearchParams(location.search).get('reset')==='1'){loginScreen('Enter a new password.','reset');return;}
      document.body.classList.remove('loginPage');
    }
    const next=initial || await call('state');
    if(version!==loadVersion)return;
    if(next.loadError)throw Error(next.loadError);
    if(next.connected===false){accessScreen('Open your ledger','Choose your workbook.',connectButtons());return;}
    const selected=el('scope').value;
    if(data && !data.owner && (JSON.stringify(data.books)!==JSON.stringify(next.books) || JSON.stringify(data.editableBooks)!==JSON.stringify(next.editableBooks))){
      resetLedger();
    }
    data=next;
    lastReadAt=Date.now();
    el('access').hidden=true;
    el('dashboard').hidden=false;
    el('ledgerNav').inert=false;
    el('settingsButton').hidden=false;
    el('tools').hidden=false;
    const books=[...new Set([...data.books,...data.entries.map(row=>row.book)])];
    el('scope').innerHTML='<option value="">All books</option>'+options(books,selected);
    el('title').textContent=data.title;
    document.title=data.title;
    el('status').textContent=preview?'Preview · Sample data only':'';
    if(el('modal').open)return;
    if(currentView==='Reports' && el('report')){
      const reportBook=el('reportBook').value;
      el('reportBook').innerHTML='<option value="">All books</option>'+options(books,reportBook);
      reportData();
    }else if(currentView==='Accounts')accountsView(el('chartBook')?.value);
    else changeScope();
  }catch(e){
    if(version!==loadVersion)return;
    if(data && pages && !data.owner){resetLedger();}
    if(!data){
      accessScreen('Couldn’t open your ledger',e.message,btn('Try again','load()',true)+(pages?btn('Sign out','signOut()')+recoveryLink(e):''));
      return;
    }
    el('status').textContent=(data?'Refresh failed. Showing the last loaded entries. ':'Could not read the ledger. ')+e.message;
  }finally{if(version===loadVersion)refreshInProgress=false;}
}
function connectButtons(){
  return btn('Choose an existing ledger','existingLedgerForm()',true)+btn('Set up a personal workbook','connectDrive()');
}
function connectDrive(){dialog('Connect Google Drive','<p>Open your own ledger, or create an empty one in My Drive → Personal &amp; Business Ledger.</p>'+btn('Connect',"write('connectPersonalDrive',[])",true));}
function existingLedgerForm(){dialog('Open existing ledger',field('Link to your ledger spreadsheet','<input id="sheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/…">')+btn('Open',"write('openExistingLedger',[el('sheetUrl').value])",true));}
let pendingAccessEmail=null;
function dialog(title,html){pendingAccessEmail=null;el('modal').classList.remove('reportClean','settingsScreen','settingsHome');el('settingsBack').hidden=true;el('settingsBack').onclick=null;el('heading').textContent=title;el('content').innerHTML=html;el('err').textContent='';if(!el('modal').open)el('modal').showModal();el('modal').scrollTop=0}
function closeDialog(){if(!locked)el('modal').close()}
el('modal').addEventListener('click',event=>{
  if(event.target!==el('modal'))return;
  const r=el('modal').getBoundingClientRect();
  if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();
});
el('modal').addEventListener('cancel',event=>{if(locked)event.preventDefault()});
el('modal').addEventListener('close',()=>{if(!el('modal').open){pendingAccessEmail=null;el('content').innerHTML='';}});
function guard(f){try{f()}catch(e){el('err').textContent=e.message}}
function options(values,current){return values.map(v=>'<option '+(v===current?'selected':'')+'>'+esc(v)+'</option>').join('')}
function field(name,html){return '<label>'+name+html+'</label>'}
function passwordInput(id,attrs=''){
  return '<span class="passwordWrap"><input id="'+id+'" type="password" '+attrs+'><button type="button" class="passwordEye" aria-label="Show password" aria-controls="'+id+'" aria-pressed="false" onclick="togglePassword(\''+id+'\',this)">'+passwordEye(false)+'</button></span>';
}
function passwordEye(visible){return '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'+(visible?'<path d="m3 3 18 18"/>':'')+'</svg>';}
function togglePassword(id,button){
  const input=el(id),visible=input.type==='password';input.type=visible?'text':'password';
  button.setAttribute('aria-label',visible?'Hide password':'Show password');button.setAttribute('aria-pressed',String(visible));button.innerHTML=passwordEye(visible);input.focus();
}
function accessEmailPreview(details){
  if(!data?.owner)return;
  const message=LedgerAccessEmail.compose(details);
  settingsDialog('Access saved · Email preview','<p class="sub">Edit your invitation, then open it in your email app to review and send. You can also send directly from your connected Gmail account.</p>'+
    field('To','<input type="email" readonly value="'+esc(message.to)+'">')+
    (details.password?field('Assigned password',passwordInput('emailPassword','readonly value="'+esc(details.password)+'"')):'<p class="sub">Existing passwords cannot be retrieved. This email will refer to their previously assigned password.</p>')+
    field('Subject','<input id="accessEmailSubject" maxlength="180" value="'+esc(message.subject)+'">')+
    field('Message','<textarea id="accessEmailBody" class="emailPreview" rows="16" maxlength="20000" spellcheck="true">'+esc(message.body)+'</textarea>')+
    '<div class="actions"><button type="button" class="primary" id="openAccessEmail" onclick="sendAccessEmail(true)">Open in email app</button><button type="button" id="sendAccessEmail" disabled onclick="sendAccessEmail()">Send directly via Gmail</button><button type="button" id="copyAccessEmail" onclick="copyAccessEmail()">Copy email</button></div>'+
    '<p id="emailStatus" role="status"></p><p id="gmailSetup" hidden><a href="https://console.cloud.google.com/apis/library/gmail.googleapis.com?project=407561237836" target="_blank" rel="noopener noreferrer">Enable Gmail for direct sending</a></p>',peopleSettings);
  const pending={details,message,sent:false,directReady:false};pendingAccessEmail=pending;
  LedgerAccessEmail.prepare().then(()=>{
    if(pendingAccessEmail!==pending)return;
    pending.directReady=true;
    if(!pending.busy&&!pending.sent)el('sendAccessEmail').disabled=false;
  }).catch(()=>{
    if(pendingAccessEmail===pending&&!el('emailStatus').textContent)el('emailStatus').textContent='Direct Gmail sending is unavailable. You can use Open in email app.';
  });
}
function editedAccessEmail(){
  const message={...pendingAccessEmail.message,subject:el('accessEmailSubject').value.trim(),body:el('accessEmailBody').value};
  if(!message.subject||!message.body.trim())throw Error('Enter an email subject and message.');
  return message;
}
async function copyAccessEmail(){
  if(locked||!pendingAccessEmail||pendingAccessEmail.sent)return;
  try{const m=editedAccessEmail();await navigator.clipboard.writeText('Subject: '+m.subject+'\n\n'+m.body);el('emailStatus').textContent='Your edited email was copied.';}catch(e){el('emailStatus').textContent=e.message||'Clipboard access was not available.';}
}
async function sendAccessEmail(useMailApp=false){
  const pending=pendingAccessEmail;
  if(locked||!data?.owner||!pending||pending.sent||data.email!==pending.details.sender)return;
  let message;try{message=editedAccessEmail();}catch(e){el('emailStatus').textContent=e.message;return;}
  const validate=async()=>{
    const members=await call('listAccess'),member=members.find(p=>p.email===pending.message.to);
    if(pendingAccessEmail!==pending||!data?.owner||data.email!==pending.details.sender||!member||member.version!==pending.details.version||
        Object.keys(member.books).length!==Object.keys(pending.details.books).length||
        !Object.entries(pending.details.books).every(([book,role])=>member.books[book]===role))throw Error('This person’s access changed. Reopen the person and prepare a new email. Nothing was sent.');
  };
  locked=true;pending.busy=true;el('accessEmailSubject').readOnly=true;el('accessEmailBody').readOnly=true;
  el('sendAccessEmail').disabled=true;el('openAccessEmail').disabled=true;
  el('emailStatus').textContent=useMailApp?'Checking book access…':'Connecting to Google and sending…';
  try{
    if(useMailApp){
      // Mobile browsers may need a fresh tap after a slow access check.
      if(!(pending.openUntil>Date.now())){
        await validate();
        if(window.navigator?.userActivation?.isActive===false){
          pending.openUntil=Date.now()+30000;
          el('emailStatus').textContent='Book access confirmed. Tap Open in email app again to open the draft.';
          return;
        }
      }
      pending.openUntil=0;
      window.location.assign(LedgerAccessEmail.mailAppUrl(message));
      el('emailStatus').textContent='Check the From account and tap Send in your email app. If it didn’t open, choose Copy email.';
      return;
    }
    pending.openUntil=0;
    await LedgerAccessEmail.send(message,pending.details.sender,validate);
    pending.sent=true;pending.details.password='';pending.message.body='';el('copyAccessEmail').disabled=true;
    if(el('emailPassword'))el('emailPassword').value='';el('accessEmailBody').value='';
    el('emailStatus').textContent='Email sent to '+pending.message.to+'.';
  }catch(e){
    if(pendingAccessEmail===pending){
      el('emailStatus').textContent=e.message;
      if(e.code==='GMAIL_API_DISABLED')el('gmailSetup').hidden=false;
    }
  }finally{
    pending.busy=false;locked=false;
    if(pendingAccessEmail===pending&&!pending.sent){
      el('sendAccessEmail').disabled=!pending.directReady;el('openAccessEmail').disabled=false;
      el('accessEmailSubject').readOnly=false;el('accessEmailBody').readOnly=false;
    }
  }
}
function btn(label,fn,primary=false){return '<button class="'+(primary?'primary':'')+'" onclick="'+fn+'">'+label+'</button>'}
function groupEntries(rows){const groups=new Map();rows.forEach(r=>{const key=r.groupKey||r.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});return [...groups.values()].reverse()}
function filtered(){
  const book=el('scope').value;
  return book ? data.entries.filter(row=>row.book===book) : data.entries;
}
function sheetWarnings(){
  if(pages || !data.warnings?.length)return '';
  return '<details class="notice"><summary>Check '+data.warnings.length+' item(s) in the Journal sheet</summary><ul>'+
    data.warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul></details>';
}
function displayDate(value){
  const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value||'');
  if(!match)return value||'';
  const month=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(match[2])-1];
  return month?match[3]+'-'+month+'-'+match[1]:value;
}
function entryList(groups){
  return groups.map(group=>{
    const row=group[0],index=data.entries.indexOf(row);
    const meta=[row.sheetDraft?'Ready to post · '+row.id:row.id,displayDate(row.date),row.book].filter(Boolean).join(' · ');
    const total=group.reduce((sum,line)=>sum+Math.round(line.debit*100),0)/100;
    return '<button class="item" onclick="detail('+index+')"><span class="entry"><span class="entryIcon"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h13a1 1 0 0 1 1 1v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 1-2zM8 3v17m3-12h5m-5 4h4"/></svg></span><span class="entryText"><strong>'+esc(row.memo)+'</strong><small>'+esc(meta)+'</small></span><b class="money">'+amount(total)+'</b></span></button>';
  }).join('')||'<p class="empty">No entries for this selection.</p>';
}
function net(rows,type){return rows.filter(r=>r.type===type).reduce((s,r)=>s+Math.round(r.debit*100)-Math.round(r.credit*100),0)/100}
function balanceCards(income,expense,book){
  return '<div class="overviewGrid"><section class="panel balance"><div class="balanceLabel"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v3M3 8h17v12H5a2 2 0 0 1-2-2zm17 4h-5v4h5"/></svg> Net income</div><div class="kpi">'+amount(income-expense)+'</div><small>'+esc(book)+' · All dates</small></section>'+
    '<section class="panel totals"><div class="summaryLine"><span>Income</span><strong>'+amount(income)+'</strong></div><div class="summaryLine"><span>Expenses</span><strong>'+amount(expense)+'</strong></div></section></div>';
}
function home(){
  if(!data)return;

function spendingByAccount(entries,month,book) {

  entries.forEach((line,index)=>{

    const key=JSON.stringify([line.book,line.code]);
    if(!accounts.has(key))accounts.set(key,{name:line.name,code:line.code,book:line.book,cents:0,lines:[]});
    const account=accounts.get(key);
    const cents=Math.round(line.debit*100)-Math.round(line.credit*100);
    account.cents+=cents;
    totalCents+=cents;
    account.lines.push({line,index,cents});
  });
  const sorted=[...accounts.values()].sort((a,b)=>b.cents-a.cents || a.name.localeCompare(b.name) || a.book.localeCompare(b.book));
  for(const account of sorted)account.lines.sort((a,b)=>b.line.date.localeCompare(a.line.date) || b.index-a.index);
  return {totalCents,accounts:sorted};
}

function formatAmount(value){

  return parts.join('.');
}
function formatTyping(input){

  input.value=after;
  let cursor=0,seen=0;
  while(cursor<after.length && seen<plainBefore){if(after[cursor]!==',')seen++;cursor++;}
  input.setSelectionRange(cursor,cursor);
}
function upperReference(input){
  const original=input.value,upper=original.toUpperCase();
  if(upper===original)return;
  const start=original.slice(0,input.selectionStart).toUpperCase().length;

function monthlyReport(book,month,clean=false,basis){
  basis=basis||el('monthBasis')?.value||el('reportBasis')?.value||'All balanced entries';
  book=book||el('reportBook')?.value||el('scope').value||(data.books.includes(data.reportBook)?data.reportBook:data.books[0]);
  month=month||data.today.slice(0,7);
  const chart=chartFor(book),accountMap=new Map(chart.filter(a=>a.use==='Posting').map(a=>[a.code,a]));
  const groupMap=new Map(chart.filter(a=>a.use==='Group').map(a=>[a.code,a.name]));
  const entries=data.entries.filter(r=>r.book===book),included=entries.filter(r=>basis!=='Posted only'||!r.sheetDraft);
  const period=r=>r.date.slice(0,7)===month,inMonth=included.filter(period);
  const banks=included.filter(r=>accountMap.get(r.code)?.role==='Bank');
  const opening=banks.filter(r=>r.date.slice(0,7)<month).reduce((s,r)=>s+Math.round(r.debit*100)-Math.round(r.credit*100),0)/100;
  const movement=banks.filter(period),sum=(lines,side)=>lines.reduce((s,r)=>s+Math.round(r[side]*100),0)/100;
  const received=sum(movement,'debit'),spent=sum(movement,'credit');
  const income=-net(inMonth,'Income'),expense=net(inMonth,'Expense'),groups=new Map();
  for(const r of inMonth){
    if(!['Income','Expense'].includes(r.type))continue;
    const parent=groupMap.get(accountMap.get(r.code)?.parent)||r.type;
    const key=r.type+'|'+parent, group=groups.get(key)||{type:r.type,name:parent,accounts:new Map()};groups.set(key,group);
    const delta=(Math.round(r.debit*100)-Math.round(r.credit*100))*(r.type==='Income'?-1:1);
    group.accounts.set(r.name,(group.accounts.get(r.name)||0)+delta);
  }
  const metric=(label,value)=>'<div><small>'+esc(label)+'</small><b>'+esc(amount(value))+'</b></div>';
  const periodLabel=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(month+'-01T00:00:00Z'));
  const postedCount=groupEntries(inMonth.filter(r=>!r.sheetDraft)).reduce((total,[row])=>total+(row.entryCount||1),0),pending=new Set(entries.filter(r=>r.sheetDraft&&period(r)).map(r=>r.id)).size;
  const latest=inMonth.reduce((max,r)=>r.date>max?r.date:max,'');
  const openingFunds=groupEntries(inMonth).reduce((total,lines)=>{
    if(lines[0].summary)return total+Number(lines[0].openingAmount||0);
    const bankLines=lines.filter(l=>accountMap.get(l.code)?.role==='Bank');
    const other=lines.filter(l=>accountMap.get(l.code)?.role!=='Bank');
    if(!bankLines.length||!other.length||!other.every(l=>l.type==='Equity'&&/opening balance|beginning balance/i.test(l.name)))return total;
    return total+Math.max(0,sum(bankLines,'debit')-sum(bankLines,'credit'));
  },0);
  const details=[...groups.values()].sort((a,b)=>b.type.localeCompare(a.type)||a.name.localeCompare(b.name)).map(g=>'<h4>'+esc(g.name)+'</h4>'+[...g.accounts].sort((a,b)=>a[0].localeCompare(b[0])).map(([name,c])=>'<div class="rline"><span>'+esc(name)+'</span><b>'+esc(amount(c/100))+'</b></div>').join('')).join('');
  const command='monthlyReport(el(\'monthBook\').value,el(\'monthPeriod\').value';
  const controls='<div class="monthControls two" '+(clean?'hidden':'')+'>'+field('Ledger book','<select id="monthBook" onchange="'+command+')">'+options(data.books,book)+'</select>')+field('Reporting period','<input id="monthPeriod" type="month" value="'+esc(month)+'" onchange="if(this.value)'+command+')">')+field('Entry status','<select id="monthBasis" onchange="'+command+')">'+options(['All balanced entries','Posted only'],basis)+'</select>')+'</div>';
  monthlyExport=LedgerDownloads.monthly(data,{book,month,basis});
  const monthlyDownloads=btn('Download monthly report CSV','downloadMonthly()')+btn('Excel · highlighted',"downloadMonthly('xlsx')");
  const sheet='<article class="statement"><div class="statementHead"><small>MONTHLY FINANCIAL REPORT</small><h2>'+esc(book)+'</h2><p>'+esc(periodLabel)+' · Lao kip</p></div>'+
    '<section><h3>Bank balance and activity</h3><div class="closing"><span>Closing bank balance</span><strong>'+esc(amount(opening+received-spent))+'</strong></div><div class="metrics">'+metric('Opening balance',opening)+metric('Bank receipts',received)+metric('Bank payments',spent)+'</div></section>'+
    '<section><h3>Income and expenditure</h3><div class="metrics">'+metric('Total income',income)+metric('Total expenditure',expense)+metric('Surplus / (deficit)',income-expense)+'</div></section>'+
    '<section><h3>Income and expenditure by account</h3>'+(details||'<p>No income or expenses for this selection.</p>')+'</section>'+
    '<footer>Posted entries: '+postedCount+(pending?' · '+(basis==='Posted only'?'Balanced drafts excluded: ':'Balanced drafts included: ')+pending:'')+'</footer></article>';
  if(clean){
    const image=makeReportImage({book,periodLabel,asOf:displayDate(latest),opening,received,spent,income,expense,openingFunds,groups,postedCount,pending,basis});
    const file=(book+'-'+month+'-financial-update.png').replace(/[^a-z0-9._-]/gi,'-');
    const actions='<div class="actions"><a class="link" download="'+esc(file)+'" href="'+image+'">Save report image</a>'+monthlyDownloads+btn('Show controls',command+',false)')+'</div>';
    dialog('Monthly report',controls+'<img class="statementImage" src="'+image+'" alt="Monthly financial report for '+esc(book)+'. Closing bank balance: '+esc(amount(opening+received-spent))+'">'+actions);
  }else dialog('Monthly report',controls+sheet+'<div class="actions">'+monthlyDownloads+btn('Screenshot view',command+',true)',true)+'</div>');
  el('modal').classList.toggle('reportClean',clean);
}
function csv(name,rows){
  const escapeCell=value=>{
    let s=String(value??'');
    if(typeof value==='string'&&/^[\s]*[=+@-]/.test(s)) s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(escapeCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name+'.csv';
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),60000);
}
function saveReport(model,format='csv'){
  if(!data||!model)return;
  const name=[model.name,model.scope.book,model.scope.month||[model.scope.from,model.scope.to].filter(Boolean).join('-')].filter(Boolean).join(' - ').replace(/[\\/:*?"<>|]/g,'-');
  if(format==='csv')return csv(name,LedgerDownloads.rows(model));
  const url=URL.createObjectURL(LedgerDownloads.xlsx(model)),link=document.createElement('a');link.href=url;link.download=name+'.xlsx';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

  locked=true;

      const members=await call('listAccess'),member=members.find(p=>p.email===email);

      accessEmailPreview({email,password,books,sender:data.email,version:member.version});
