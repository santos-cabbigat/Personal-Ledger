<!--ledger-state--><script src="demo.js?v=20261111-3"></script><script>
'use strict';
const el=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=n=>'₭'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const inSheet = Boolean(window.google && google.script && google.script.run);
const call = inSheet
  ? (method,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args))
  : previewCall;
let data=null,draft=null,locked=false;
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && data && !locked && !el('modal').open)load();
});
function ready(){if(data)return true;el('status').textContent='Connect Google Drive or open your ledger to continue.';return false}
let loadVersion=0;
async function load(initial){
  const version=++loadVersion;
  el('status').textContent=inSheet?'Reading Google Sheet…':'Loading sample entries…';
  try{
    const next=initial || await call('state');
    if(next.loadError)throw Error(next.loadError);
    if(version!==loadVersion)return;
    if(next.connected===false){
      data=null;
      el('title').textContent='Personal & Business Ledger';
      el('status').textContent='Signed in as '+next.email;
      el('homeData').innerHTML='<div class="panel"><h2>Your ledger</h2>'+connectButtons()+'</div>';
      return;
    }
    const selected=el('scope').value;
    data=next;
    const books=[...new Set([...data.books,...data.entries.map(row=>row.book)])];
    el('scope').innerHTML='<option value="">All books</option>'+options(books,selected);
    el('title').textContent=data.title;
    document.title=data.title;
    el('status').textContent=inSheet?'Saved books · Google Sheets':'Preview · Sample data only';
    home();
  }catch(e){if(version!==loadVersion)return;data=null;el('homeData').replaceChildren();el('status').textContent='Could not read the ledger. '+e.message;}
}
function connectButtons(){
  return btn('Connect Google Drive','connectDrive()',true)+btn('Open existing ledger','existingLedgerForm()');
}
function connectDrive(){dialog('Connect Google Drive','<p>Open your own ledger, or create an empty one in My Drive → Personal &amp; Business Ledger.</p>'+btn('Connect',"write('connectPersonalDrive',[])",true));}
function existingLedgerForm(){dialog('Open existing ledger',field('Link to your ledger spreadsheet','<input id="sheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/…">')+btn('Open',"write('openExistingLedger',[el('sheetUrl').value])",true));}
function dialog(title,html){el('heading').textContent=title;el('content').innerHTML=html;el('err').textContent='';if(!el('modal').open)el('modal').showModal();el('modal').scrollTop=0}
function closeDialog(){if(!locked)el('modal').close()}
el('modal').addEventListener('cancel',event=>{if(locked)event.preventDefault()});
function guard(f){try{f()}catch(e){el('err').textContent=e.message}}
function options(values,current){return values.map(v=>'<option '+(v===current?'selected':'')+'>'+esc(v)+'</option>').join('')}
function field(name,html){return '<label>'+name+html+'</label>'}
function btn(label,fn,primary=false){return '<button class="'+(primary?'primary':'')+'" onclick="'+fn+'">'+label+'</button>'}
function groupEntries(rows){const groups=new Map();rows.forEach(r=>{const key=r.groupKey||r.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)});return [...groups.values()].reverse()}
let projectFilter='',categoryFilter='';
function categories(){return [...new Set(data.entries.map(r=>r.category).filter(Boolean))].sort();}
function projects(){return [...new Set(data.entries.map(r=>r.project).filter(Boolean))].sort((a,b)=>a.localeCompare(b));}
function filtered(){const book=el('scope').value;return data.entries.filter(r=>(!book||r.book===book)&&(!projectFilter||r.project===projectFilter)&&(!categoryFilter||r.category===categoryFilter));}
function projectPicker(){
  const names=projects();
  if(!names.includes(projectFilter)) projectFilter='';
  if(!names.length)return '';
  return field('Project','<select id="projectFilter" onchange="projectFilter=this.value;home()"><option value="">All projects</option>'+options(names,projectFilter)+'</select>');
}
function sheetWarnings(){
  if(!data.warnings?.length)return '';
  return '<details class="notice"><summary>Check '+data.warnings.length+' item(s) in the Journal sheet</summary><ul>'+
    data.warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul></details>';
}
function entryList(groups){return groups.map(g=>{const r=g[0],index=data.entries.indexOf(r);return '<button class="item" onclick="detail('+index+')"><span class="row"><strong>'+esc(r.memo)+'</strong><b class="money">'+amount(g.reduce((a,l)=>a+l.debit,0))+'</b></span><small>'+esc(r.sheetDraft?'Ready to post · '+r.id:r.id)+' · '+esc(r.date)+' · '+esc(r.book)+(r.project?' · '+esc(r.project):'')+'</small></button>'}).join('')||'<p class="muted">No entries yet.</p>'}
function net(rows,type){return rows.filter(r=>r.type===type).reduce((s,r)=>s+Math.round(r.debit*100)-Math.round(r.credit*100),0)/100}
function home(){if(!data)return;const names=categories();if(!names.includes(categoryFilter))categoryFilter='';const picker=projectPicker()+(names.length?field('Category','<select id="categoryFilter" onchange="categoryFilter=this.value;home()"><option value="">All categories</option>'+options(names,categoryFilter)+'</select>'):'');let rows=filtered();el('homeData').innerHTML=picker+sheetWarnings()+'<section class="panel"><small>Net income · All dates</small><div class="kpi">'+amount(-net(rows.filter(r=>!r.sheetDraft),'Income')-net(rows.filter(r=>!r.sheetDraft),'Expense'))+'</div></section><h2>Recent entries</h2>'+entryList(groupEntries(rows).slice(0,5))}
function detail(index){
  const row=data.entries[index],lines=data.entries.filter(r=>(r.groupKey||r.id)===(row.groupKey||row.id));
  dialog('Journal entry','<b>'+esc(row.memo)+'</b><p class="sub">'+esc([row.book,row.project,row.category,row.date].filter(Boolean).join(' · '))+'</p>'+
    ledgerTable(lines)+'<p class="sub">'+esc(row.by?'Posted by '+row.by:'Entered in Google Sheets')+'<br>'+esc(row.id)+'</p>'+btn(row.sheetDraft?'Review & post sheet entry':'Edit entry','editEntry('+index+')',true));
}
function editEntry(index){
  const row=data.entries[index];
  draft={mode:'Journal',key:crypto.randomUUID(),ledgerId:data.ledgerId,editId:row.id,revision:row.revision,groupKey:row.groupKey,sheetDraft:row.sheetDraft,
    book:row.book,project:row.project||'',category:row.category||'',date:row.date,memo:row.memo,
    lines:data.entries.filter(r=>(r.groupKey||r.id)===(row.groupKey||row.id)).map(r=>({code:r.code,debit:r.debit?String(r.debit):'',credit:r.credit?String(r.credit):''}))};
  entryForm('Journal',true);
}
function ledgerTable(lines){return '<div class="table"><table><tr><th>Account</th><th>Debit</th><th>Credit</th></tr>'+lines.map(l=>'<tr><td>'+esc(l.name)+'</td><td>'+(+l.debit?amount(l.debit):'—')+'</td><td>'+(+l.credit?amount(l.credit):'—')+'</td></tr>').join('')+'</table></div>'}
function idPicker(groups){
  const posted=groups.filter(group=>!group[0].sheetDraft);
  if(!posted.length)return '';
  return field('Find entry ID','<select id="entryIdPicker" onchange="if(this.value)detail(Number(this.value))"><option value="">Choose an entry ID</option>'+
    posted.map(([line])=>'<option value="'+data.entries.indexOf(line)+'">'+esc(line.id)+' · '+esc(line.memo)+'</option>').join('')+'</select>');
}
function journals(){if(!ready())return;const groups=groupEntries(filtered());dialog('Journal','<div class="actions">'+btn('New entry',"entryForm('Journal')",true)+btn('Download journal CSV','downloadJournal()')+'</div>'+idPicker(groups)+entryList(groups))}
function accountsView(){if(!ready())return;dialog('Chart of accounts',btn('Add account','newAccount()',true)+btn('Download accounts CSV','downloadAccounts()')+data.accounts.map((a,i)=>'<button class="item" onclick="accountDetail('+i+')"><strong>'+esc(a.code)+' · '+esc(a.name)+'</strong><br><small>'+esc(a.type)+' · '+esc(a.use)+(a.parent?' · Parent '+esc(a.parent):'')+'</small></button>').join(''))}
function accountDetail(i){let a=data.accounts[i];let codes=new Set([a.code]);for(let j=0;j<data.accounts.length;j++){let n=codes.size;data.accounts.forEach(v=>{if(codes.has(v.parent))codes.add(v.code)});if(n===codes.size)break}dialog(a.name,entryList(groupEntries(filtered().filter(r=>codes.has(r.code)))))}
function acOptions(list,current){return list.map(a=>'<option value="'+esc(a.code)+'" '+(a.code===current?'selected':'')+'>'+esc(a.code)+' · '+esc(a.name)+'</option>').join('')}
function newAccount(){dialog('Add account',field('Code','<input id="code" inputmode="numeric">')+field('Name','<input id="accountName" maxlength="80">')+field('Classification','<select id="classify" onchange="parents()">'+options(['Asset','Liability','Equity','Income','Expense'])+'</select>')+field('Parent account','<select id="parent"></select>')+field('Use','<select id="use">'+options(['Posting','Group'])+'</select>')+btn('Save account','addAccount()',true));parents()}
function parents(){el('parent').innerHTML='<option value="">No parent</option>'+acOptions(data.accounts.filter(a=>a.use==='Group'&&a.type===el('classify').value))}
async function write(method,args,after){if(locked)return;locked=true;el('err').textContent='Saving…';let result;try{result=await call(method,...args)}catch(e){el('err').textContent=e.message;locked=false;return}locked=false;el('modal').close();await load();if(after&&data)after(result)}
function addAccount(){write('saveAccount',[{ledgerId:data.ledgerId,code:el('code').value,name:el('accountName').value,type:el('classify').value,parent:el('parent').value,use:el('use').value}],accountsView)}
function entryForm(mode,keep=false){if(!ready())return;if(!keep){draft={mode,key:crypto.randomUUID(),ledgerId:data.ledgerId,project:projectFilter,category:categoryFilter,book:el('scope').value||data.books[0]||'',date:data.today,memo:'',lines:[{code:mode==='Expense'?'5100':'1100',debit:'',credit:''},{code:mode==='Expense'?'1100':'4100',debit:'',credit:''}]}}dialog(draft.sheetDraft?'Post sheet entry':draft.editId?'Edit journal entry':mode==='Expense'?'Record expense':'New journal entry','<div class="two">'+field('Book','<select id="book">'+options([...new Set([...data.books,draft.book].filter(Boolean))],draft.book)+'</select>')+field('Date','<input type="date" id="date" value="'+esc(draft.date)+'">')+'</div>'+field('Project (optional)','<input id="project" list="projectNames" maxlength="80" value="'+esc(draft.project)+'" placeholder="Choose or type a project name"><datalist id="projectNames">'+options(projects(),draft.project)+'</datalist>')+field('Category (optional)','<input id="category" list="categoryNames" maxlength="80" value="'+esc(draft.category)+'" placeholder="Choose or type a category"><datalist id="categoryNames">'+options(categories(),draft.category)+'</datalist>')+field('Description','<input id="memo" maxlength="180" value="'+esc(draft.memo)+'">')+'<div id="lines"></div><div class="actions">'+(mode==='Journal'?btn('Add line','addLine()'):'')+btn('Review','guard(review)',true)+'</div>');drawLines()}
function formatAmount(value){
  const parts=String(value??'').replace(/,/g,'').split('.');
  if(parts.length>2 || !/^\d*$/.test(parts[0]) || (parts.length===2 && !/^\d*$/.test(parts[1])))return String(value);
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return parts.join('.');
}
function formatTyping(input){
  const before=input.value,caret=input.selectionStart;
  const plainBefore=before.slice(0,caret).replace(/,/g,'').length;
  const after=formatAmount(before);
  if(after===before)return;
  input.value=after;
  let cursor=0,seen=0;
  while(cursor<after.length && seen<plainBefore){if(after[cursor]!==',')seen++;cursor++;}
  input.setSelectionRange(cursor,cursor);
}
function amountInput(id,value){
  return '<input inputmode="decimal" id="'+id+'" oninput="formatTyping(this)" value="'+esc(formatAmount(value))+'">';
}
function drawLines(){const list=data.accounts.filter(a=>a.use==='Posting');if(draft.mode==='Expense'){el('lines').innerHTML=field('Expense account','<select id="ac0">'+acOptions(list.filter(a=>a.type==='Expense'),draft.lines[0].code)+'</select>')+field('Paid from','<select id="ac1">'+acOptions(list.filter(a=>a.type==='Asset'||a.type==='Liability'),draft.lines[1].code)+'</select>')+field('Amount (LAK)',amountInput('expAmount',draft.lines[0].debit));return}
el('lines').innerHTML=draft.lines.map((l,i)=>'<div class="line">'+field('Account','<select id="ac'+i+'">'+acOptions(list,l.code)+'</select>')+'<div class="two">'+field('Debit',amountInput('dr'+i,l.debit))+field('Credit',amountInput('cr'+i,l.credit))+'</div>'+(draft.lines.length>2?btn('Remove','removeLine('+i+')'):'')+'</div>').join('')}
function readForm(){draft.book=el('book').value;draft.date=el('date').value;draft.memo=el('memo').value.trim();draft.project=el('project').value.trim();draft.category=el('category').value.trim();draft.lines.forEach((l,i)=>{l.code=el('ac'+i).value;if(draft.mode==='Expense'){l.debit=i===0?el('expAmount').value.replace(/,/g,''):'';l.credit=i===1?el('expAmount').value.replace(/,/g,''):''}else{l.debit=el('dr'+i).value.replace(/,/g,'').trim();l.credit=el('cr'+i).value.replace(/,/g,'').trim()}})}
function addLine(){readForm();if(draft.lines.length<40){draft.lines.push({code:'',debit:'',credit:''});drawLines()}}
function removeLine(i){readForm();draft.lines.splice(i,1);drawLines()}
function review(){readForm();if(!draft.memo||!draft.date)throw Error('Enter a date and description.');
let dr=0,cr=0;for(const l of draft.lines){for(const n of [l.debit,l.credit])if(n&&!/^(0|[1-9]\d{0,10})(\.\d{1,2})?$/.test(n))throw Error('Enter amounts with up to two decimals.');if((+l.debit>0)===(+l.credit>0))throw Error('Each account needs either a debit or a credit.');dr+=Math.round(l.debit*100);cr+=Math.round(l.credit*100)}
if(dr!==cr||!dr||new Set(draft.lines.map(l=>l.code)).size<2)throw Error('Debits and credits must balance across at least two accounts.');
const lines=draft.lines.map(l=>({...l,name:data.accounts.find(a=>a.code===l.code).name}));dialog('Review entry','<strong>'+esc(draft.memo)+'</strong><p class="sub">'+esc([draft.book,draft.project,draft.category,draft.date].filter(Boolean).join(' · '))+'</p>'+ledgerTable(lines)+'<p>Balanced · '+amount(dr/100)+'</p><div class="actions">'+btn('Back','entryForm(draft.mode,true)')+btn(draft.editId&&!draft.sheetDraft?'Save changes':'Post entry','post()',true)+'</div>')}
function post(){
  write('postEntry',[draft],id=>{
    draft=null;
    const index=data.entries.findIndex(row=>row.id===id);
    if(index>=0)detail(index);
  });
}
function reports(){if(!ready())return;dialog('Reports',field('Report','<select id="report" onchange="reportData()">'+options(['Trial balance','Income and expenses','Balance sheet','General ledger'])+'</select>')+'<div class="two">'+field('From','<input type="date" id="from" onchange="reportData()">')+field('Through','<input type="date" id="through" onchange="reportData()">')+'</div><div id="result"></div>'+btn('Download report CSV','downloadReport()'));reportData()}
let reportExport;
function reportData(){
  const kind=el('report').value,from=el('from').value,to=el('through').value,asOf=kind==='Balance sheet';
  el('from').disabled=asOf;
  reportExport=null;
  if(!asOf&&from&&to&&from>to){el('result').textContent='Choose an end date on or after the start date.';return;}
  const rows=filtered().filter(r=>!r.sheetDraft).filter(r=>(asOf||!from||r.date>=from)&&(!to||r.date<=to));
  const accounts=data.accounts.filter(a=>a.use==='Posting');
  let headers,records=[],moneyColumns=[];
  if(kind==='Income and expenses'||asOf){
    headers=['Item','Amount (LAK)'];moneyColumns=[1];
    const inc=-net(rows,'Income'),exp=net(rows,'Expense'),liabilities=-net(rows,'Liability'),equity=-net(rows,'Equity');
    records=asOf?[['Assets',net(rows,'Asset')],['Liabilities',liabilities],['Equity before earnings',equity],['Accumulated earnings',inc-exp],['Total liabilities and equity',liabilities+equity+inc-exp]]:
      [['Income',inc],['Expenses',exp],['Net income',inc-exp]];
  }else if(kind==='General ledger'){
    headers=['Code','Account','Date','Book','Project','Category','Description','Debit (LAK)','Credit (LAK)'];moneyColumns=[7,8];
    for(const account of accounts)for(const line of rows.filter(r=>r.code===account.code)){
      records.push([account.code,account.name,line.date,line.book,line.project||'',line.category||'',line.memo,line.debit,line.credit]);
    }
  }else{
    headers=['Code','Account','Debit (LAK)','Credit (LAK)'];moneyColumns=[2,3];
    let totalDr=0,totalCr=0;
    for(const account of accounts){
      const cents=rows.filter(r=>r.code===account.code).reduce((sum,r)=>sum+Math.round(r.debit*100)-Math.round(r.credit*100),0);
      if(cents){const dr=Math.max(cents,0),cr=Math.max(-cents,0);records.push([account.code,account.name,dr/100,cr/100]);totalDr+=dr;totalCr+=cr;}
    }
    records.push(['','Total',totalDr/100,totalCr/100]);
  }
  const scope=[el('scope').value||'All books',projectFilter||'All projects',categoryFilter||'All categories',asOf?'Beginning':from||'Beginning',to||'All dates'];
  const html='<div class="table"><table><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+
    records.map(row=>'<tr>'+row.map((v,i)=>'<td>'+esc(moneyColumns.includes(i)?amount(v):v)+'</td>').join('')+'</tr>').join('')+'</table></div>';
  el('result').innerHTML='<p class="sub">'+esc(scope.join(' · '))+'</p>'+html;
  reportExport={name:kind,rows:[[kind],['Book','Project','Category','From','Through'],scope,[],headers,...records]};
}
function csv(name,rows){
  const escapeCell=value=>{
    let s=String(value??'');
    if(typeof value==='string'&&/^[\s]*[=+@-]/.test(s)) s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const blob=new Blob(['\ufeff'+rows.map(r=>r.map(escapeCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name+'.csv';
  document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),60000);
}
function downloadReport(){if(reportExport)csv(reportExport.name,reportExport.rows);}
function downloadJournal(){csv('Journal',[['Entry ID','Date','Book','Description','Account code','Account name','Type','Debit (LAK)','Credit (LAK)','Posted by','Project','Category'],...filtered().map(r=>[r.id,r.date,r.book,r.memo,r.code,r.name,r.type,r.debit,r.credit,r.by,r.project,r.category])]);}
function downloadAccounts(){csv('Accounts',[['Code','Account name','Classification','Parent code','Use'],...data.accounts.map(a=>[a.code,a.name,a.type,a.parent,a.use])]);}
function bookSettings(){
  return field('Book types','<span class="sub">'+esc(data.books.join(' · '))+'</span><input id="newBookType" maxlength="80" placeholder="New book name">')+
    btn('Add book type','saveBookTypeFromForm()');
}
function saveBookTypeFromForm(){
  const name=el('newBookType').value.trim();
  if(!name){el('err').textContent='Enter a book name.';return;}

}
function sheetSettings(){if(!ready())return;dialog('Settings',(data.owner?field('App name','<input id="appName" value="'+esc(data.title)+'" maxlength="60">')+btn('Save name','saveName()'):'<b>'+esc(data.title)+'</b>')+bookSettings()+'<p><a class="link" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/'+encodeURIComponent(data.ledgerId)+'/export?format=xlsx">Download all data (Excel)</a></p>'+connectButtons()+'<p class="sub">Signed in as '+esc(data.email)+'</p><a class="link" href="'+esc(data.url)+'" target="_blank" rel="noopener">Open Google Sheet</a>'+(data.owner?'<p>To add another person, open the Sheet, tap Share, and invite their Google account as an editor.</p>':''))}
function settings(){if(!ready())return;if(inSheet)return sheetSettings();dialog('Settings',field('App name','<input id="appName" value="'+esc(data.title)+'" maxlength="60">')+btn('Save name','saveName()',true)+bookSettings()+'<p class="sub">Preview changes last until you reload this page.</p>')}
function saveName(){write('renameLedger',[el('appName').value,data.ledgerId])}
const initialLedger=el('initialLedger');
load(initialLedger ? JSON.parse(initialLedger.textContent) : null);
